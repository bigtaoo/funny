# nginx 反代（本地「真实发布」模拟，对齐 server/Caddyfile 的路由语义）。
# 单站点同源：静态 SPA + /api（剥前缀转 metaserver）+ /gw（控制面 WS）+ /ws（数据面 WS）。
# 内部服务名（metaserver/gateway/gameserver）由 docker compose 网络 DNS 解析。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 响应压缩（WORLDSVC_CONCURRENCY_AUDIT §8，2026-09-09）。SLG 地图这类 payload 是几千个
    # 近乎相同的瓦片对象，实测 `GET /world/map` r=40 = 523,124 B → 线上 29,708 B（**5.7%，17.6×**）。
    # 对齐 `server/Caddyfile` 的 `encode`，好让本地量出来的字节数跟生产一致。
    #
    # ⚠️ `gzip_proxied` 默认是 `off`，也就是**上游来的响应一律不压缩** —— 只写 `gzip on`
    # 对 /api /world /social 这些反代路径完全没有效果（这里绝大部分字节都在那儿）。
    gzip              on;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_min_length   1024;
    # 5 而不是 6：实测 513KB 上 L1=7.4% / L6=5.0% / L9=4.5%，收益早就压平，CPU 却在 L9 翻六倍。
    gzip_comp_level   5;
    gzip_types        application/json application/javascript text/css text/plain image/svg+xml application/wasm;

    # REST：剥掉 /api 前缀转 metaserver（fastify 路由是 /auth/*、/save … 不含 /api）。
    # proxy_pass 带尾斜杠 → 用 /api/ 替换为 /，等价 Caddy 的 handle_path。
    location /api/ {
        proxy_pass http://metaserver:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 控制面 WS：房间 / 匹配（保留 /gw 路径 + ?token= 查询）。
    location /gw {
        proxy_pass http://gateway:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 数据面 WS：锁步对战（保留 /ws 路径 + ?ticket= 查询）。
    location /ws {
        proxy_pass http://gameserver:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SLG 大世界第四公网面：worldsvc 路由本身含 /world 前缀，
    # 故 proxy_pass 不带尾斜杠（保留完整路径，不剥前缀）。
    # 注：家族 /family/* 已迁至 socialsvc（见下方 /social），worldsvc 不再代理。
    location /world {
        proxy_pass http://worldsvc:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 拍卖行已去 SLG/worldId 耦合，独立服务 auctionsvc（拍卖任务5，AUCTION_DESIGN §9）。
    location /auction {
        proxy_pass http://auctionsvc:18086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 社交第五公网面（P1起）：socialsvc 路由本身含 /social 前缀，proxy_pass 不带尾斜杠。
    location /social {
        proxy_pass http://socialsvc:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 埋点投递：客户端 POST /analytics/events、GET /analytics/config → analyticsvc。
    location /analytics {
        proxy_pass http://analyticsvc:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # index.html / version.json 永不缓存，确保新版本立即生效。
    location ~ ^/(index\.html|version\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 带 contenthash 的 JS / 资源文件可永久缓存（内容变 → 文件名变 → 新 URL）。
    location ~* \.(js|css|png|jpg|webp|gif|tao|mp3|wav|ogg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA：其余路径回退到 index.html（单页应用）。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
