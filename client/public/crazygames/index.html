<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the CrazyGames App runs the game edge to edge, and env(safe-area-inset-*)
         only reports the notch / rounded corners with it (CrazyGamesPlatform.getSafeAreaInsets).
         Inside the website's iframe the insets stay zero either way. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Nivara — Notebook Wars</title>
    <!-- Relative paths only: the portal serves the bundle from its own sub-path. No web manifest /
         touch icon — the game runs inside the portal's iframe, never as an installable page. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <meta name="theme-color" content="#1b3a6b" />
    <!-- Load checkpoint 1 of 2 (ANALYTICS_DESIGN §3.6f): one anonymous tick before the bundle
         downloads, split only by input class; analytics.countLoadedLaunch() sends the other half once
         the first screen is up. Same no-identity endpoint as the tutorial funnel: platform + step
         only, plus the build version. Keep the input-class test identical to countLoadedLaunch's.
         It runs BEFORE the SDK tag on purpose: that tag is synchronous, so a tick placed after it
         missed every launch abandoned while the SDK itself was downloading. -->
    <script>
      (function () {
        var base = '<%= htmlWebpackPlugin.options.analyticsBase %>';
        if (!base || typeof fetch !== 'function') return;
        var coarse = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
        fetch(base + '/analytics/config?p=crazygames&t=' + (coarse ? 'open_mobile' : 'open_desktop')
          + '&v=' + encodeURIComponent('<%= htmlWebpackPlugin.options.buildVersion %>') + '&c=' + (coarse ? 'm' : 'd'),
          { mode: 'no-cors', keepalive: true }).catch(function () {});
      })();
    </script>
    <!-- CrazyGames SDK — must be loaded before game bundle -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #f5f0e8; }
      canvas { display: block; touch-action: none; }
      /* Portal mobile requirement: no text selection / callout on long-press. Editable elements keep
         their own selection (user-select auto resolves to contain on them). */
      html, body, canvas {
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
  </body>
</html>
