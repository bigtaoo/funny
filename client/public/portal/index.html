<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Shared by the self-test web-portal targets (itch, newgrounds — design/game/WEB_PORTALS.md).
         Runs inside the portal's iframe; viewport-fit=cover keeps env(safe-area-inset-*) meaningful
         when a portal goes fullscreen on a phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Nivara — Notebook Wars</title>
    <!-- Relative paths only: the portal serves the bundle from its own sub-path. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <meta name="theme-color" content="#1b3a6b" />
    <!-- Load checkpoint 1 of 2 (ANALYTICS_DESIGN §3.6f), identical to the CrazyGames template's except
         that `p` is the portal's own TARGET, so each channel is counted apart. -->
    <script>
      (function () {
        var base = '<%= htmlWebpackPlugin.options.analyticsBase %>';
        if (!base || typeof fetch !== 'function') return;
        var coarse = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
        fetch(base + '/analytics/config?p=<%= htmlWebpackPlugin.options.platform %>&t=' + (coarse ? 'open_mobile' : 'open_desktop')
          + '&v=' + encodeURIComponent('<%= htmlWebpackPlugin.options.buildVersion %>') + '&c=' + (coarse ? 'm' : 'd'),
          { mode: 'no-cors', keepalive: true }).catch(function () {});
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #f5f0e8; }
      canvas { display: block; touch-action: none; }
      html, body, canvas {
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
  </body>
</html>
