name: ops-deploy

# Auto-publish the ops admin frontend (Worker nivara-ops) to Cloudflare, served at ops.gamestao.com.
# Trigger: CI ("build + unit tests" + "full-link E2E") finishing successfully on main, when the ops-related
# paths differ from the commit this workflow last successfully deployed, or manual Run from the Actions page.
# Flow: npm ci → npm run build (bakes git short hash into the header version string at build time) → wrangler deploy.
# Deployment details / same-origin reverse proxy / CF Access: design/product/deploy-cloudflare.md §6.
#
# Gated on CI (not on push directly): CI's e2e job takes up to 25 minutes while this deploy job takes
# a couple of minutes, so a plain `push: branches: [main]` trigger would race a still-running/still-red
# CI and could ship a broken commit before CI ever reported failure. `workflow_run` waits for CI's overall
# conclusion first. See .github/actions/paths-changed-since for why the path filter lives in the job body
# (workflow_run has no native `paths:`), and why it diffs against the last SUCCESSFULLY DEPLOYED commit
# instead of against this commit's parent — the old parent-diff silently dropped a deploy for good
# whenever the commit that touched these paths never reached the deploy job (CI red, run cancelled).
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — Create via CF "My Profile → API Tokens", requires at least Workers Scripts:Edit
#                            (includes Workers Routes / Workers KV / Account read; using the "Edit Cloudflare Workers" template is simplest)
#   CLOUDFLARE_ACCOUNT_ID  — Account ID (visible in the right sidebar of the CF dashboard; needed with multiple wrangler accounts)
# Enable switch: repo variable OPS_DEPLOY_ENABLED = true (job skipped if not set, to avoid red builds before setup is complete).
# wrangler secret (ADMIN_PROXY_SECRET) persists on the Worker; deploy does not clear it, so it does not need to be re-set each time.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token: the deploy step authenticates with its own secret, and `check` only needs to
# read this workflow's own run history to find the last commit that actually shipped
# (see .github/actions/paths-changed-since).
permissions:
  contents: read
  actions: read

# Only one ops deployment runs at a time; new run cancels the old one to prevent concurrent deploy conflicts.
concurrency:
  group: ops-deploy
  cancel-in-progress: true

jobs:
  # Gate: enable switch + CI-passed + "has tools/ops/** moved since the last successful deploy". Split out of `deploy`
  # so the real deploy steps only need one `if:` (on the job) instead of one per step.
  check:
    runs-on: ubuntu-latest
    if: ${{ vars.OPS_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      # workflow_dispatch has no deployed-vs-head comparison to make — always proceeds, so no checkout needed.
      - uses: actions/checkout@v5
        if: github.event_name != 'workflow_dispatch'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Head commit only; paths-changed-since shallow-fetches the deployed baseline itself.
          fetch-depth: 1

      - name: check whether tools/ops/** changed since the last successful deploy
        id: paths
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/paths-changed-since
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          include: |
            ^tools/ops/
            ^wrangler/ops\.jsonc$
            ^wrangler/worker\.ops\.js$
            ^\.github/workflows/ops-deploy\.yml$
            ^\.github/actions/paths-changed-since/

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ needs.check.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/ops/package-lock.json

      - name: ops install
        working-directory: tools/ops
        run: npm ci

      # Outputs tools/ops/dist; webpack runs git rev-parse at build time to bake the header version string.
      - name: ops build
        working-directory: tools/ops
        run: npm run build

      # Run from repo root using -c to specify the ops config (assets point to ./tools/ops/dist).
      # Not using cloudflare/wrangler-action (it swallows real errors and bundles a deprecated Node runtime);
      # using the runner's Node + npx wrangler directly so errors are visible. wrangler 4.x is required for assets.run_worker_first.
      - name: deploy to Cloudflare
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.104.0 deploy -c wrangler/ops.jsonc
