name: animator-deploy

# Auto-publish the skeletal animation editor animator (Worker animator, static assets) to Cloudflare.
# Trigger: CI ("build + unit tests" + "full-link E2E") finishing successfully on main and having touched
# animator-related files, or manual Run from the Actions page.
# Flow: npm ci → npm run build (webpack production) → wrangler deploy.
# Deployment details: design/tools/animator/DESIGN.md (Workers static assets build, wrangler/animator.jsonc assets-only), if present.
#
# Gated on CI (not on push directly): CI's e2e job takes up to 25 minutes while this deploy job takes
# a couple of minutes, so a plain `push: branches: [main]` trigger would race a still-running/still-red
# CI and could ship a broken commit before CI ever reported failure. `workflow_run` waits for CI's overall
# conclusion first. See .github/actions/paths-changed-since for why the path filter moved into the job body
# (workflow_run has no native `paths:`).
#
# Reuses the ops/client repo secrets (same CF account; "Edit Cloudflare Workers" token covers all account Workers):
#   CLOUDFLARE_API_TOKEN   — Requires at least Workers Scripts:Edit (account-level; also works for animator, no new token needed)
#   CLOUDFLARE_ACCOUNT_ID  — Account ID (same value as ops/client)
# Enable switch: repo variable ANIMATOR_DEPLOY_ENABLED = true (job skipped if not set, to avoid red builds before setup is complete).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Only one animator deployment runs at a time; new run cancels the old one to prevent concurrent deploy conflicts.
concurrency:
  group: animator-deploy
  cancel-in-progress: true

jobs:
  # Gate: enable switch + CI-passed + "did this commit actually touch tools/animator/**". Split out of
  # `deploy` so the real deploy steps only need one `if:` (on the job) instead of one per step.
  check:
    runs-on: ubuntu-latest
    if: ${{ vars.ANIMATOR_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      # workflow_dispatch has no head_sha / prior commit to diff against — always proceeds, so no checkout needed.
      - uses: actions/checkout@v5
        if: github.event_name != 'workflow_dispatch'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: check whether tools/animator/** changed in this commit
        id: paths
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/paths-changed-since
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          include: |
            ^tools/animator/
            ^wrangler/animator\.jsonc$
            ^\.github/workflows/animator-deploy\.yml$

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ needs.check.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/animator/package-lock.json

      - name: animator install
        working-directory: tools/animator
        run: npm ci

      # Outputs tools/animator/dist.
      - name: animator build
        working-directory: tools/animator
        run: npm run build

      # Run from repo root with -c wrangler/animator.jsonc (assets point to ../tools/animator/dist, SPA fallback, no Worker script).
      # Uses npx wrangler directly (not wrangler-action) so errors are visible as-is.
      - name: deploy to Cloudflare
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.104.0 deploy -c wrangler/animator.jsonc
