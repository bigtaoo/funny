name: iOS OTA - Publish hot-update

# Publishes a JS/asset hot-update bundle for the iOS shell (Capgo, IOS_RELEASE.md §11).
# Does NOT touch the App Store — this ships web-layer changes only. Native changes go through
# release-ios.yml (tag ios-v*) instead. No macOS runner needed (no native compile).
#
# Trigger: push a tag `ota-v<version>` or run manually with an explicit version.
# Version scheme (IOS_RELEASE.md §11.3): <shell version>.<n>, e.g. ota-v1.0.15.1, where the shell
# version is the builtin bundle version of the newest release-ios.yml build (<MARKETING_VERSION>.<run
# number>). That makes every OTA outrank the shell it was built for, and every newer shell outrank it.
# The "Resolve version" step enforces both that and "strictly above the live manifest".
# Flow: npm ci → build:mobile (NW_BUILD_VERSION baked from the tag) → zip dist → upload the zip and
# a refreshed manifest.json to the R2 bucket served at ota.gamestao.com.
#
# ⚠️ Only publish when the change is JS/asset-only. Anything needing new native capability must
# raise minNativeVersion (edit MIN_NATIVE below) and ship the matching shell via release-ios.yml
# first, or old shells will pull a bundle they can't run.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN     token with R2 write on the bucket below
#   CLOUDFLARE_ACCOUNT_ID    Cloudflare account id
# Required repo variable (optional; defaults below):
#   OTA_R2_BUCKET            R2 bucket name bound to ota.gamestao.com (default: nivara-ota)

on:
  push:
    tags:
      - 'ota-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version <shell version>.<n>, e.g. 1.0.15.1 (shell version = newest iOS build)'
        required: true
        type: string

env:
  # Bump this when a bundle starts depending on native capability shipped in a newer shell.
  MIN_NATIVE: '1.0.0'
  OTA_R2_BUCKET: ${{ vars.OTA_R2_BUCKET || 'nivara-ota' }}

permissions:
  contents: read
  actions: read # gh run list on release-ios.yml, to find the newest shell build

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#ota-v}"
          fi
          if [ -z "$V" ] || [ "$V" = "$GITHUB_REF_NAME" ]; then
            echo "Could not resolve a version (ref=$GITHUB_REF_NAME)"; exit 1
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "OTA version must be <shell version>.<n> with four numeric parts (got: $V)"; exit 1
          fi
          # The shell part must be the newest iOS build exactly: older, and that build ignores this
          # bundle; newer, and the next shell would bake a lower version and download this one.
          MV=$(grep -o 'MARKETING_VERSION = [^;]*' client/ios/App/App.xcodeproj/project.pbxproj | sort -u | sed 's/.* = //')
          BUILD=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release-ios.yml --status success --limit 1 --json number -q '.[0].number')
          if [ -z "$BUILD" ]; then echo "Could not find a successful release-ios.yml run"; exit 1; fi
          if [ "${V%.*}" != "$MV.$BUILD" ]; then
            echo "OTA version $V must start with the newest shell version $MV.$BUILD (e.g. $MV.$BUILD.1)"; exit 1
          fi
          LIVE=$(curl -fsS --max-time 10 https://ota.gamestao.com/manifest.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p')
          if [ -z "$LIVE" ]; then echo "Could not read the live manifest version"; exit 1; fi
          if [ "$LIVE" = "$V" ] || [ "$(printf '%s\n%s\n' "$LIVE" "$V" | sort -V | tail -1)" != "$V" ]; then
            echo "OTA version $V must be strictly above the live manifest version $LIVE"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing OTA bundle version: $V (shell $MV.$BUILD, replacing live $LIVE)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      # Same mobile target as the App Store build (backend baked to api.gamestao.com); the only
      # difference is NW_BUILD_VERSION, which the running bundle compares against the manifest.
      - name: Build mobile bundle
        working-directory: client
        env:
          NW_BUILD_VERSION: ${{ steps.ver.outputs.version }}
          NW_API_BASE: https://api.gamestao.com/api
          NW_GATEWAY_WS: wss://api.gamestao.com/gw
          NW_WORLD_BASE: https://api.gamestao.com
          NW_SOCIAL_BASE: https://api.gamestao.com
        run: npm run build:mobile

      - name: Zip bundle
        working-directory: client/dist
        run: zip -r -q "../${{ steps.ver.outputs.version }}.zip" .

      - name: Write manifest
        working-directory: client
        run: |
          cat > manifest.json << EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "url": "https://ota.gamestao.com/${{ steps.ver.outputs.version }}.zip",
            "minNativeVersion": "${{ env.MIN_NATIVE }}"
          }
          EOF
          cat manifest.json

      - name: Upload bundle to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Versioned zip: immutable, long-cacheable. (r2 object put targets remote by default;
          # the --remote flag doesn't exist in the wrangler-action's pinned 3.90.0.)
          command: r2 object put ${{ env.OTA_R2_BUCKET }}/${{ steps.ver.outputs.version }}.zip --file=client/${{ steps.ver.outputs.version }}.zip --content-type=application/zip

      - name: Publish manifest to R2 (last, so it only points at an already-uploaded zip)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # manifest must never be cached, or clients keep seeing the old version.
          command: r2 object put ${{ env.OTA_R2_BUCKET }}/manifest.json --file=client/manifest.json --content-type=application/json --cache-control="no-cache, must-revalidate"
