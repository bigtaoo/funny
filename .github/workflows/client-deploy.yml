name: client-deploy

# Auto-publish the main game client (web bundle, Worker nivara-client) to Cloudflare, served at a.gamestao.com.
# Trigger: CI ("build + unit tests" + "full-link E2E") finishing successfully on main and having touched
# client-related files, or manual Run from the Actions page.
# Flow: npm ci → npm run build:web (bakes production API/WS addresses into the bundle) → wrangler deploy.
# Deployment details / address baking variables: design/product/deploy-cloudflare.md §6.
#
# Gated on CI (not on push directly): CI's e2e job takes up to 25 minutes while this deploy job takes
# a couple of minutes, so a plain `push: branches: [main]` trigger would race a still-running/still-red
# CI and could ship a broken commit before CI ever reported failure. `workflow_run` waits for CI's overall
# conclusion first. See .github/actions/paths-changed-since for why the path filter moved into the job body
# (workflow_run has no native `paths:`).
#
# Reuses the ops repo secrets (same CF account e64b61f1...; "Edit Cloudflare Workers" token covers all account Workers):
#   CLOUDFLARE_API_TOKEN   — Requires at least Workers Scripts:Edit (account-level; also works for nivara-client, no new token needed)
#   CLOUDFLARE_ACCOUNT_ID  — Account ID (same value as ops)
# Enable switch: repo variable CLIENT_DEPLOY_ENABLED = true (job skipped if not set, to avoid red builds before setup is complete).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Only one client deployment runs at a time; new run cancels the old one to prevent concurrent deploy conflicts.
concurrency:
  group: client-deploy
  cancel-in-progress: true

jobs:
  # Gate: enable switch + CI-passed + "did this commit actually touch client/**". Split out of `deploy`
  # so the real deploy steps only need one `if:` (on the job) instead of one per step.
  check:
    runs-on: ubuntu-latest
    if: ${{ vars.CLIENT_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      # workflow_dispatch has no head_sha / prior commit to diff against — always proceeds, so no checkout needed.
      - uses: actions/checkout@v5
        if: github.event_name != 'workflow_dispatch'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: check whether client/** changed in this commit
        id: paths
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/paths-changed-since
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          # The web bundle inlines the deterministic engine + SLG shared code via the webpack alias
          # @nw/engine → server/engine/src (and server/shared/src/slg). An engine-only change (e.g. the
          # lockstep catch-up fix) still ships to players ONLY through this client bundle, so it must
          # retrigger the deploy — otherwise the fix sits on main while prod keeps serving the old engine.
          include: |
            ^client/
            ^server/engine/src/
            ^server/shared/src/slg/
            ^wrangler/client\.jsonc$
            ^\.github/workflows/client-deploy\.yml$

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ needs.check.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: client install
        working-directory: client
        run: npm ci

      # Short commit SHA as the web build's version (parallels the OTA workflow's git-tag version,
      # so version.json / __NW_BUILD_VERSION__ actually identifies which commit is live instead of
      # always reading the '0.0.0' fallback).
      - name: resolve build version
        id: ver
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Outputs client/dist; production addresses are baked to api.gamestao.com (consistent with manual deploy commands).
      - name: client build (web)
        working-directory: client
        env:
          NW_API_BASE: https://api.gamestao.com/api
          NW_GATEWAY_WS: wss://api.gamestao.com/gw
          NW_WORLD_BASE: https://api.gamestao.com
          # Must be set explicitly: getSocialBaseUrl() otherwise derives host:8085 from NW_WORLD_BASE
          # (a dev-only direct port not exposed in prod), breaking family/sect/world social calls.
          NW_SOCIAL_BASE: https://api.gamestao.com
          # Same reasoning as NW_SOCIAL_BASE above: getAuctionBaseUrl() otherwise derives host:18086
          # from NW_WORLD_BASE (a dev-only direct port not exposed in prod), breaking all auction calls.
          NW_AUCTION_BASE: https://api.gamestao.com
          NW_BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: npm run build:web

      # Run from repo root using -c to specify the client config (assets point to ./client/dist, no Worker script).
      # Uses npx wrangler directly (not wrangler-action) so errors are visible as-is.
      - name: deploy to Cloudflare
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.104.0 deploy -c wrangler/client.jsonc
