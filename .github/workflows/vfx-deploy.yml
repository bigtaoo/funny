name: vfx-deploy

# Auto-publish the combat VFX editor vfx-editor (Worker nivara-vfx, pure static assets) to Cloudflare.
# Trigger: CI ("build + unit tests" + "full-link E2E") finishing successfully on main, when the vfx-related
# paths differ from the commit this workflow last successfully deployed, or manual Run from the Actions page.
# Flow: npm ci → npm run build (webpack production, outputs tools/vfx-editor/dist) → wrangler deploy.
# Deployment details: design/tools/vfx-editor/DESIGN.md.
#
# Gated on CI (not on push directly): CI's e2e job takes up to 25 minutes while this deploy job takes
# a couple of minutes, so a plain `push: branches: [main]` trigger would race a still-running/still-red
# CI and could ship a broken commit before CI ever reported failure. `workflow_run` waits for CI's overall
# conclusion first. See .github/actions/paths-changed-since for why the path filter lives in the job body
# (workflow_run has no native `paths:`), and why it diffs against the last SUCCESSFULLY DEPLOYED commit
# instead of against this commit's parent — the old parent-diff silently dropped a deploy for good
# whenever the commit that touched these paths never reached the deploy job (CI red, run cancelled).
#
# Reuses the ops/client/animator repo secrets (same CF account; "Edit Cloudflare Workers" token covers all account Workers):
#   CLOUDFLARE_API_TOKEN   — Requires at least Workers Scripts:Edit (account-level; also works for vfx, no new token needed)
#   CLOUDFLARE_ACCOUNT_ID  — Account ID (same value as ops/client/animator)
# The vfx editor is a pure frontend static site with no Supabase/backend dependencies; no variables need to be injected at build time.
# Enable switch: repo variable VFX_DEPLOY_ENABLED = true (job skipped if not set, to avoid red builds before setup is complete).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token: the deploy step authenticates with its own secret, and `check` only needs to
# read this workflow's own run history to find the last commit that actually shipped
# (see .github/actions/paths-changed-since).
permissions:
  contents: read
  actions: read

# Only one vfx deployment runs at a time; new run cancels the old one to prevent concurrent deploy conflicts.
concurrency:
  group: vfx-deploy
  cancel-in-progress: true

jobs:
  # Gate: enable switch + CI-passed + "has tools/vfx-editor/** moved since the last successful deploy". Split out of
  # `deploy` so the real deploy steps only need one `if:` (on the job) instead of one per step.
  check:
    runs-on: ubuntu-latest
    if: ${{ vars.VFX_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      # workflow_dispatch has no deployed-vs-head comparison to make — always proceeds, so no checkout needed.
      - uses: actions/checkout@v5
        if: github.event_name != 'workflow_dispatch'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Head commit only; paths-changed-since shallow-fetches the deployed baseline itself.
          fetch-depth: 1

      - name: check whether tools/vfx-editor/** changed since the last successful deploy
        id: paths
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/paths-changed-since
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          include: |
            ^tools/vfx-editor/
            ^wrangler/vfx\.jsonc$
            ^\.github/workflows/vfx-deploy\.yml$
            ^\.github/actions/paths-changed-since/

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ needs.check.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vfx-editor/package-lock.json

      - name: vfx install
        working-directory: tools/vfx-editor
        run: npm ci

      # Outputs tools/vfx-editor/dist (webpack production).
      - name: vfx build
        working-directory: tools/vfx-editor
        run: npm run build

      # Run from repo root using -c to specify the vfx config (assets point to ./tools/vfx-editor/dist).
      # Uses npx wrangler directly (not wrangler-action) so errors are visible as-is.
      - name: deploy to Cloudflare
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.104.0 deploy -c wrangler/vfx.jsonc
