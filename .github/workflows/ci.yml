name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Previous runs for the same branch/PR are automatically cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks only: codegen staleness + file-length + tsc -b across all 13 workspaces. No
  # tests, no Docker, done in well under a minute — kept separate from server-test (below) so a
  # typecheck failure surfaces immediately without waiting on the slowest test shard, and so it
  # doesn't get needlessly repeated on every test-matrix runner.
  server-checks:
    name: server codegen/typecheck checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: server install
        working-directory: server
        run: npm ci
      # metaserver openapi.yml is bundled from per-domain fragments in server/contracts/openapi/
      # (one per MetaService mixin); this must pass before the routes.gen.ts check below.
      - name: server codegen check (metaserver openapi bundle)
        working-directory: server/metaserver
        run: npm run gen:api:contracts:check
      # ADR-023 P1: metaserver REST codegen staleness check
      - name: server codegen check (metaserver openapi)
        working-directory: server/metaserver
        run: npm run gen:api:server:check
      # ADR-023 P2: worldsvc REST codegen staleness check
      - name: server codegen check (worldsvc openapi)
        working-directory: server/worldsvc
        run: npm run gen:api:world:check
      # auction task4: auctionsvc REST codegen staleness check (openapi-auction.yml, self-contained spec)
      - name: server codegen check (auctionsvc openapi)
        working-directory: server/auctionsvc
        run: npm run gen:api:auction:check
      # socialsvc REST codegen staleness check (openapi-social.yml, self-contained spec)
      - name: server codegen check (socialsvc openapi)
        working-directory: server/socialsvc
        run: npm run gen:api:social:check
      # ADR-023 P3: gateway + gameserver proto codegen staleness check
      - name: server codegen check (proto gateway+gameserver)
        working-directory: server
        run: |
          npm run proto:gen --workspace=@nw/gateway
          npm run proto:gen --workspace=@nw/gameserver
          git diff --exit-code gateway/src/generated gameserver/src/generated
      # claudedocs/server.md "单文件 500 行收敛": baseline-drift check, not a hard <=500 gate —
      # only fails on a NEW file crossing 500 lines or a known baseline file growing past its
      # recorded count (server/scripts/file-length-baseline.json). 2026-08-13: the original
      # 30-file backlog is fully split (0 tracked entries) — this step is now a hard 0-over-500
      # gate for server/ in practice, not "tracked debt, not blocked on" anymore.
      - name: server file length check
        working-directory: server
        run: npm run check:filelength
      # Guards against a workspace silently getting zero CI type-checking (socialsvc/botsvc were
      # missing from this step's old hand-enumerated package list for weeks before anyone noticed —
      # see claudedocs/server.md). Fails if tsconfig.build.json's references drift from
      # package.json#workspaces in either direction.
      - name: server workspace coverage check
        working-directory: server
        run: npm run check:workspacecoverage
      - name: server typecheck (tsc -b, solution file — all 13 workspaces)
        working-directory: server
        run: npm run typecheck

  # 2026-08-14: split out of the old single "build + unit tests" job (see claudedocs/server.md) —
  # `npm run test:coverage --workspaces` used to run all 13 server workspaces back-to-back on one
  # runner (~11-12 min), then client and tools tests ran AFTER that on the SAME runner, serially,
  # even though none of the three depend on each other. metaserver (~6.3 min) and worldsvc (~3.3
  # min) alone were ~85% of that time — both set `fileParallelism: false` in their vitest config
  # (a real Mongo-race guard, not incidental slowness; see the comment in their vitest.config.ts —
  # do not flip this without re-auditing every e2e test's DB isolation) so they can't be sped up
  # by just letting vitest use more cores in-process. Splitting them onto their own CI runners
  # sidesteps that: each matrix job gets its own mongodb-memory-server instance, so the
  # same-process DB-race concern the serial flag guards against doesn't apply across runners.
  # Rest of the workspaces (each well under a minute) share one "rest" shard rather than each
  # getting a runner of their own — CI job startup (checkout+node+npm ci, ~20-30s) would dominate
  # actual test time at that granularity. Net effect: server test wall-clock ~11-12min -> ~6.3min
  # (bounded by the metaserver shard), running concurrently with client-test/tools-test below
  # instead of after them.
  server-test:
    name: server test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: metaserver
            workspaces: metaserver
            # upload-artifact roots the artifact at the least-common-ancestor of these paths; a
            # single directory here means that directory's CONTENTS become the artifact root
            # (coverage-report's download step below accounts for that per shard).
            coverage_paths: server/metaserver/coverage
          - name: worldsvc
            workspaces: worldsvc
            coverage_paths: server/worldsvc/coverage
          - name: rest
            workspaces: shared engine gateway matchsvc gameserver commercial admin analyticsvc socialsvc auctionsvc botsvc
            # 11 explicit dirs sharing ancestor `server/` -> artifact preserves each `<pkg>/coverage/`
            # subpath relative to `server/` (unlike the single-dir shards above).
            coverage_paths: |
              server/shared/coverage
              server/engine/coverage
              server/gateway/coverage
              server/matchsvc/coverage
              server/gameserver/coverage
              server/commercial/coverage
              server/admin/coverage
              server/analyticsvc/coverage
              server/socialsvc/coverage
              server/auctionsvc/coverage
              server/botsvc/coverage
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: server install
        working-directory: server
        run: npm ci
      # mongodb-memory-server (used by admin/analyticsvc/auctionsvc/commercial/metaserver/socialsvc/
      # worldsvc's e2e globalSetup.ts) downloads a pinned mongod binary on first use; cache it so
      # repeat CI runs don't re-download ~100MB every time. Shared across shards by cache key (not
      # workspace-scoped) since it's the same pinned binary regardless of which shard downloads it.
      - name: cache mongod binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-v7.0.14
      # NW_REQUIRE_DB makes every e2e suite's DB-connect helper re-throw instead of silently
      # `describe.skipIf`-ing itself out when Mongo/Redis is unreachable (see claudedocs/server.md,
      # "单文件 500 行收敛" 附近的 CI 门禁记录) — without it, a broken mongod download or an
      # unreachable Redis service just makes these ~110 e2e cases vanish with exit code 0.
      - name: server unit + e2e tests (${{ matrix.shard.name }})
        working-directory: server
        env:
          NW_REQUIRE_DB: '1'
          NW_REDIS_URL: redis://127.0.0.1:6379
        run: |
          args=()
          for w in ${{ matrix.shard.workspaces }}; do args+=(-w "$w"); done
          npm run test:coverage "${args[@]}" --if-present

      # coverage-report (below) needs every shard's coverage/ output on one filesystem; each
      # shard only produces coverage dirs for the workspaces it actually ran, so the glob below
      # naturally scopes to just those.
      - name: upload coverage artifact (${{ matrix.shard.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-${{ matrix.shard.name }}
          path: ${{ matrix.shard.coverage_paths }}
          if-no-files-found: ignore
          retention-days: 1

  # —— Client: type-check + unit tests + web build —— (own runner, parallel with server-test/tools-test)
  client-test:
    name: client test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: client install
        working-directory: client
        run: npm ci
      # claudedocs/client-modules.md "单文件 500 行收敛": same baseline-drift check as the server
      # step above (client/scripts/file-length-baseline.json) — only fails on a NEW file crossing
      # 500 lines or a known baseline file growing past its recorded count. 2026-08-13: schema now
      # requires every baseline entry to carry a written "reason" (checkFileLength.mjs rejects
      # entries without one, and rejects any entry over the 800-line hard cap outright) — a
      # 2026-08-13 audit found 11 of the then-19 entries had accumulated with zero justification,
      # some for 2+ days, before anyone noticed. Those 11 were split out of the baseline entirely
      # (not "documented", actually removed by splitting the files); the 7 remaining entries are
      # genuinely justified exceptions (thin forwarding facades / single shared-state roots).
      - name: client file length check
        working-directory: client
        run: npm run check:filelength
      # vitest (esbuild) and webpack don't type-check, and tsconfig.json's include is src-only,
      # so test/** blueprint/DTO drift stays latent. tsconfig.test.json pulls src + test/** into
      # one program so this step fails on that drift (see CC-1 card-instance migration).
      - name: client typecheck (src + tests)
        working-directory: client
        run: npm run typecheck
      - name: client unit tests
        working-directory: client
        run: npm run test:coverage
      # UI smoke: headless PIXI adapter constructs real scenes in pure Node to prove each scene starts correctly.
      # No Docker / browser / live stack needed, so this lives in the fast path.
      - name: client UI smoke tests
        working-directory: client
        run: npm run test:ui
      - name: client web build
        working-directory: client
        run: npm run build:web

      - name: upload coverage artifact (client)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/**
          if-no-files-found: ignore
          retention-days: 1

  # —— tools: type-check + build + file-length gate —— (own runner, parallel with server-test/client-test)
  tools-test:
    name: tools typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: tools install (animator/level-editor/map-editor/ops/vfx-editor/desktop-shell)
        working-directory: tools
        run: |
          for d in animator level-editor map-editor ops vfx-editor desktop-shell; do
            (cd "$d" && npm ci)
          done
      # 2026-08-13 follow-up: animator/level-editor/vfx-editor gained the same typecheck+test
      # scripts as map-editor/ops (io/ split coverage + a bootstrap pure-module test each — see
      # claudedocs/animator.md). desktop-shell remains build-only (webpack ts-loader is its typecheck).
      - name: tools typecheck (animator, level-editor, map-editor, ops, vfx-editor)
        working-directory: tools
        run: |
          for d in animator level-editor map-editor ops vfx-editor; do
            (cd "$d" && npm run typecheck)
          done
      - name: tools unit tests (animator, level-editor, map-editor, ops, vfx-editor)
        working-directory: tools
        run: |
          for d in animator level-editor map-editor ops vfx-editor; do
            (cd "$d" && npm test)
          done
      - name: tools build (animator/level-editor/vfx-editor/desktop-shell)
        working-directory: tools
        run: |
          for d in animator level-editor vfx-editor desktop-shell; do
            (cd "$d" && npm run build)
          done
      - name: tools file length check
        working-directory: tools
        run: node scripts/checkFileLength.mjs

  # Reads every server-test shard's + client-test's uploaded coverage/ artifacts (each shard only
  # produced coverage for the workspaces it ran) back onto one filesystem, then prints the same
  # consolidated table the old single-job "test coverage report" step did.
  # scripts/coverageSummary.mjs never throws, so `if: always()` + downloading whatever artifacts
  # did get produced lets it still render a (possibly partial) table even if a shard failed.
  coverage-report:
    name: test coverage report
    needs: [server-test, client-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Each download target below matches how upload-artifact rooted that shard's artifact (see
      # the comments on `coverage_paths` and the upload step in server-test/client-test): the
      # metaserver/worldsvc/client shards each uploaded a single directory's contents (so they're
      # downloaded straight into that same directory), while the "rest" shard uploaded 11 dirs
      # sharing the `server/` ancestor (so it's downloaded back into `server/` to reconstruct each
      # `<pkg>/coverage/` subpath). `if-no-files-found: ignore` on upload plus continue-on-error
      # here means a shard that produced no coverage (e.g. it failed before running) just leaves
      # that package's row as "—" in the report instead of failing this job.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-coverage-metaserver
          path: server/metaserver/coverage
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-coverage-worldsvc
          path: server/worldsvc/coverage
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-coverage-rest
          path: server
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: client-coverage
          path: client/coverage
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: test coverage report
        run: node scripts/coverageSummary.mjs

  # Slow path: docker compose brings up the full stack (mongo + meta + commercial + gateway + matchsvc + game),
  # then runs the real client orchestration core (createAppCore) as a Node process on the runner host for full end-to-end tests.
  e2e:
    name: full-link E2E (live stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI uses fixed weak keys (the stack is ephemeral and not exposed to the public internet). Production injects strong random strings via .env.
      NW_JWT_SECRET: ci-jwt-secret
      NW_INTERNAL_KEY: ci-internal-key
      NW_ADMIN_JWT_SECRET: ci-admin-jwt-secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: client install
        working-directory: client
        run: npm ci

      # Bring up the full stack and wait for all services to be healthy (--wait works with healthchecks in compose). Caddy is not started.
      - name: bring up server stack
        working-directory: server
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml \
            up -d --build --wait \
            redis mongo metaserver commercial gateway matchsvc gameserver worldsvc analyticsvc

      # SLG worldsvc deployment smoke (S8-0): proves the 7th process starts in the prod image and the public REST 4th face is reachable.
      - name: worldsvc health smoke
        run: curl -fsS http://localhost:18084/health

      # analyticsvc deployment smoke (A9-1): proves the 9th process starts in the prod image.
      - name: analyticsvc health smoke
        run: curl -fsS http://localhost:18085/health

      - name: run full-link E2E
        working-directory: client
        env:
          NW_API_BASE: http://localhost:18080
          NW_EXPECT_GATEWAY: ws://localhost:8086/gw
        run: npm run test:e2e

      # Capacity smoke: small fleet (20 clients) against the live stack, verifying matchmaking holds under concurrency.
      # Real capacity probing is done locally / in a dedicated environment with a larger NW_LOAD_CLIENTS value.
      - name: run ranked load smoke (small fleet)
        working-directory: client
        env:
          NW_API_BASE: http://localhost:18080
          NW_LOAD_CLIENTS: '20'
        run: npm run test:load

      # Browser smoke (claudedocs/client-testing.md 缺口B): the only layer with a real renderer /
      # real WebGL, driven via window.__nwE2E (see entries/web-e2e.ts) instead of pixel clicks.
      # Reuses the stack already brought up above — no separate docker-compose bring-up. New as of
      # 2026-07-22: continue-on-error until it's proven stable across a run of PRs, then remove the
      # flag to make it a hard merge gate (this is the day-branch → main PR gate, chosen precisely
      # because this job's stack cost is too high to pay on every feature-branch merge).
      - name: install Playwright chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: run browser smoke (two-account, real WebGL)
        id: browser_smoke
        working-directory: client
        continue-on-error: true
        run: npm run test:browser

      # continue-on-error above means `failure()` never sees this step fail — check its recorded
      # outcome directly instead, or this upload (and the trial-period signal) would never fire.
      - name: upload Playwright report on failure
        if: steps.browser_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

      # Dump full stack logs on failure to aid diagnosis (ports / handshakes / matchmaking queue).
      - name: dump server logs on failure
        if: failure()
        working-directory: server
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs --no-color --tail=400

      - name: tear down server stack
        if: always()
        working-directory: server
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml down -v
