name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge-queue support (2026-08-15). Off until the queue is enabled in repo settings + branch
  # protection; harmless until then (the event simply never fires). With it on, CI runs against the
  # exact commit that will land on main BEFORE it lands, so "PR green → main red" stops being
  # possible by construction — the merge is what fails, not main, and no deploy is ever skipped.
  merge_group:
  workflow_dispatch:

# Previous runs for the same branch/PR are automatically cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest job in the workflow (no install, no build — just node + git ls-files), so it goes
  # first and gives the fastest possible signal on a doc-only PR. Gates markdown link rot only:
  # ADR-067 deliberately does NOT gate the 500-line doc convention, because docs have to be cut
  # along semantic seams and a hard line limit pushes toward mechanical cuts that read worse —
  # the script prints oversized files as a non-blocking notice instead. Link/anchor breakage has
  # no such judgment call: it either resolves or it doesn't. Introduced after a repo-wide sweep
  # found 21 dead links and 7 dead anchors that had accumulated unnoticed (all now fixed).
  docs-check:
    name: docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No `cache: npm` — this script has zero dependencies and the repo root has no lockfile.
      - name: markdown link/anchor check
        run: node scripts/checkDocLinks.mjs

  # Fast checks only: codegen staleness + file-length + tsc -b across all 13 workspaces. No
  # tests, no Docker, done in well under a minute — kept separate from server-test (below) so a
  # typecheck failure surfaces immediately without waiting on the slowest test shard, and so it
  # doesn't get needlessly repeated on every test-matrix runner.
  server-checks:
    name: server codegen/typecheck checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: server install
        working-directory: server
        run: npm ci
      # metaserver openapi.yml is bundled from per-domain fragments in server/contracts/openapi/
      # (one per MetaService mixin); this must pass before the routes.gen.ts check below.
      - name: server codegen check (metaserver openapi bundle)
        working-directory: server/metaserver
        run: npm run gen:api:contracts:check
      # ADR-023 P1: metaserver REST codegen staleness check
      - name: server codegen check (metaserver openapi)
        working-directory: server/metaserver
        run: npm run gen:api:server:check
      # ADR-023 P2: worldsvc REST codegen staleness check
      - name: server codegen check (worldsvc openapi)
        working-directory: server/worldsvc
        run: npm run gen:api:world:check
      # auction task4: auctionsvc REST codegen staleness check (openapi-auction.yml, self-contained spec)
      - name: server codegen check (auctionsvc openapi)
        working-directory: server/auctionsvc
        run: npm run gen:api:auction:check
      # socialsvc REST codegen staleness check (openapi-social.yml, self-contained spec)
      - name: server codegen check (socialsvc openapi)
        working-directory: server/socialsvc
        run: npm run gen:api:social:check
      # ADR-023 P3: gateway + gameserver proto codegen staleness check
      - name: server codegen check (proto gateway+gameserver)
        working-directory: server
        run: |
          npm run proto:gen --workspace=@nw/gateway
          npm run proto:gen --workspace=@nw/gameserver
          git diff --exit-code gateway/src/generated gameserver/src/generated
      # claudedocs/server.md "单文件 500 行收敛": baseline-drift check, not a hard <=500 gate —
      # only fails on a NEW file crossing 500 lines or a known baseline file growing past its
      # recorded count (server/scripts/file-length-baseline.json). 2026-08-13: the original
      # 30-file backlog is fully split (0 tracked entries) — this step is now a hard 0-over-500
      # gate for server/ in practice, not "tracked debt, not blocked on" anymore.
      - name: server file length check
        working-directory: server
        run: npm run check:filelength
      # ESLint, new on 2026-08-26 and new to server/ entirely: until this day client/ was the only
      # package in the repo with a linter, so the rules were enforced on the UI layer and nowhere
      # near the money, match, or simulation code. One config at server/ covers all 13 workspaces
      # (rules shared with client/ and tools/* in eslint.shared.mjs). First run over 623 files
      # found 58 problems and no rot: 34 imports/locals left behind by the mixin-chain and
      # territory/structures splits, 11 `any`, 5 rethrows dropping the original error in the IAP
      # verification paths, 5 `{}`-as-empty-payload, and 3 eslint-disable comments suppressing
      # nothing (written in code that had never been linted). Errors fail the job.
      - name: server lint
        working-directory: server
        run: npm run lint
      # Guards against a workspace silently getting zero CI type-checking (socialsvc/botsvc were
      # missing from this step's old hand-enumerated package list for weeks before anyone noticed —
      # see claudedocs/server.md). Fails if tsconfig.build.json's references drift from
      # package.json#workspaces in either direction.
      - name: server workspace coverage check
        working-directory: server
        run: npm run check:workspacecoverage
      # claudedocs/server.md "SLG worldsvc 要点": the 2026-08-24 concurrency sweep concluded that a $set
      # publishing an absolute, snapshot-derived running total IS the lost-update shape (it cost us an
      # exploitable troop duplication, deleted reinforcements, and multi-attacker siege damage). Nothing in
      # the type system enforces that, so this gate fails on a new one — or on an allowance gone stale.
      - name: server absolute-write drift check
        working-directory: server
        run: npm run check:absolutewrites
      # claudedocs/server.md "拍卖行成交原子性": the auction house is the one flow whose atomicity boundary
      # spans three processes and four databases, so it runs on a durable journal instead of a transaction.
      # That journal is worthless if a new flow can move coins or items without recording that it owes
      # them, and it was exactly an inline (unrecorded, failure-swallowing) mail send that used to destroy
      # a seller's proceeds on any single meta hiccup. This gate keeps each cross-service capability — and
      # every `auction_…` idempotency key — in the one file that owns it.
      - name: auction settlement journal drift check
        working-directory: server
        run: npm run check:auctionjournal
      - name: server typecheck (tsc -b, solution file — all 13 workspaces)
        working-directory: server
        run: npm run typecheck
      # 2026-08-19: the step above only covers src/** — every workspace's tsconfig.json is src-only
      # and vitest runs through esbuild (types erased), so ~380 server test files were never
      # type-checked at all (first run surfaced 758 errors). Each workspace now has a
      # tsconfig.test.json pulling test/** into the program; this fans out to all of them. Must run
      # AFTER the tsc -b above: these configs are plain (non-build) programs, so they resolve
      # @nw/* through the referenced projects' dist/*.d.ts that step produces.
      - name: server typecheck (test programs — test/** in every workspace)
        working-directory: server
        run: npm run typecheck:test
      # 2026-08-21: server/tools/econ-sim is the one package under server/ that is NOT a workspace
      # (it is a headless balance simulator, not a service), so every command above — `tsc -b` on the
      # solution file, `--workspaces` fan-outs, the coverage gate's package list — skipped it by
      # construction. It had therefore never been type-checked or tested in CI at all, while still
      # importing @nw/shared/@nw/engine numeric constants and being edited as recently as ADR-069
      # (2026-08-19): an engine renumbering could brick it and nothing would say so until someone
      # went to run a simulation. No install step needed — it has no node_modules of its own and
      # resolves tsc/vitest/@nw/* from server/'s hoisted tree by walking up. Must run AFTER the
      # `tsc -b` above, same reason as the step above it: @nw/* resolve through the built dist/.
      # scripts/checkWorkspaceCoverage.mjs now fails if this step (or the test one in server-test)
      # stops naming it, so it cannot silently fall back out the way it silently stayed out.
      - name: server econ-sim typecheck (non-workspace package)
        working-directory: server/tools/econ-sim
        run: npm run typecheck

  # 2026-08-14: split out of the old single "build + unit tests" job (see claudedocs/server.md) —
  # `npm run test:coverage --workspaces` used to run all 13 server workspaces back-to-back on one
  # runner (~11-12 min), then client and tools tests ran AFTER that on the SAME runner, serially,
  # even though none of the three depend on each other. metaserver (~6.3 min) and worldsvc (~3.3
  # min) alone were ~85% of that time — both set `fileParallelism: false` in their vitest config
  # (a real Mongo-race guard, not incidental slowness; see the comment in their vitest.config.ts —
  # do not flip this without re-auditing every e2e test's DB isolation) so they can't be sped up
  # by just letting vitest use more cores in-process. Splitting them onto their own CI runners
  # sidesteps that: each matrix job gets its own mongodb-memory-server instance, so the
  # same-process DB-race concern the serial flag guards against doesn't apply across runners.
  # Rest of the workspaces (each well under a minute) share one "rest" shard rather than each
  # getting a runner of their own — CI job startup (checkout+node+npm ci, ~20-30s) would dominate
  # actual test time at that granularity. Net effect: server test wall-clock ~11-12min -> ~6.3min
  # (bounded by the metaserver shard), running concurrently with client-test/tools-test below
  # instead of after them.
  server-test:
    name: server test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: metaserver
            workspaces: metaserver
            # upload-artifact roots the artifact at the least-common-ancestor of these paths; a
            # single directory here means that directory's CONTENTS become the artifact root
            # (coverage-report's download step below accounts for that per shard).
            coverage_paths: server/metaserver/coverage
          - name: worldsvc
            workspaces: worldsvc
            coverage_paths: server/worldsvc/coverage
          - name: rest
            workspaces: shared engine gateway matchsvc gameserver commercial admin analyticsvc socialsvc auctionsvc botsvc
            # 11 explicit dirs sharing ancestor `server/` -> artifact preserves each `<pkg>/coverage/`
            # subpath relative to `server/` (unlike the single-dir shards above).
            coverage_paths: |
              server/shared/coverage
              server/engine/coverage
              server/gateway/coverage
              server/matchsvc/coverage
              server/gameserver/coverage
              server/commercial/coverage
              server/admin/coverage
              server/analyticsvc/coverage
              server/socialsvc/coverage
              server/auctionsvc/coverage
              server/botsvc/coverage
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: server install
        working-directory: server
        run: npm ci
      # mongodb-memory-server (used by admin/analyticsvc/auctionsvc/commercial/metaserver/socialsvc/
      # worldsvc's e2e globalSetup.ts) downloads a pinned mongod binary on first use; cache it so
      # repeat CI runs don't re-download ~100MB every time. Shared across shards by cache key (not
      # workspace-scoped) since it's the same pinned binary regardless of which shard downloads it.
      - name: cache mongod binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-v7.0.14
      # 2026-08-14 fix: this looked redundant with server-checks' own "server typecheck" step, but
      # server-checks runs on a SEPARATE runner with its own ephemeral filesystem — its build
      # output (each workspace's gitignored dist/) never reaches these runners. Several workspaces
      # (metaserver, botsvc, ...) import @nw/engine via plain node_modules resolution — the actual
      # symlinked package.json#main points at dist/index.js — without declaring it as a
      # tsconfig.json `references` entry (only gateway/worldsvc do), so it's not something each
      # shard's own scoped `tsc -b` (run inside its `test:coverage` script) picks up as a build
      # dependency either. First cut of this split skipped this step and every shard whose tests
      # import @nw/engine failed immediately with "Cannot find module '@nw/engine'" (dist/ never
      # built). `npm run typecheck` here is the same root solution-file `tsc -b` as server-checks —
      # walks all 13 workspaces' project references in dependency order, materializing dist/ for
      # engine/shared/etc. Duplicated per shard (~13s each) rather than shared via artifact
      # upload/download from server-checks: dist/ is small and fast to rebuild, so the extra
      # complexity of shipping it between jobs isn't worth it — and the 13s runs in parallel across
      # shards, so it costs shared runner-minutes, not wall-clock.
      - name: server typecheck (tsc -b, solution file — builds dist/ the tests import)
        working-directory: server
        run: npm run typecheck
      # NW_REQUIRE_DB makes every e2e suite's DB-connect helper re-throw instead of silently
      # `describe.skipIf`-ing itself out when Mongo/Redis is unreachable (see claudedocs/server.md,
      # "单文件 500 行收敛" 附近的 CI 门禁记录) — without it, a broken mongod download or an
      # unreachable Redis service just makes these ~110 e2e cases vanish with exit code 0.
      # 2026-08-15: this used to be `test` on PRs and `test:coverage` everywhere else. The comment
      # justifying that split claimed it was "a pure script swap: same test files, same assertions,
      # same failures" — the first two are true, the third is not. v8 instrumentation stretches every
      # await window in the suite (measured on the same commit: worldsvc 184.5s → 226.3s, collect
      # 20s → 41s), so timing-sensitive e2e assertions are strictly likelier to fail under coverage,
      # i.e. exactly on the pre-CD pass and never on the PR that was supposed to gate it. Worse, the
      # 90% coverage gate itself only existed on that pass, so a coverage regression was structurally
      # undetectable until after the merge. Both events now run the identical command: whatever main
      # can fail on, the PR can fail on first. Cost: ~+25% on the server shards (client's share was
      # bought back outright — see its own comment below) — paid on PRs, where waiting is cheap,
      # instead of on an already-merged commit, where a red run means "merged but not deployed".
      - name: server unit + e2e tests (${{ matrix.shard.name }})
        working-directory: server
        env:
          NW_REQUIRE_DB: '1'
          NW_REDIS_URL: redis://127.0.0.1:6379
        run: |
          args=()
          for w in ${{ matrix.shard.workspaces }}; do args+=(-w "$w"); done
          npm run test:coverage "${args[@]}" --if-present

      # 2026-08-21, same gap as server-checks' econ-sim typecheck step: not a workspace, so no
      # `--workspaces` fan-out ever reached its 18 tests (~5s). Rides the `rest` shard rather than
      # getting a runner of its own — it needs neither Mongo nor Redis, and a shard of its own would
      # spend 30s on checkout+install to run 5s of tests. Deliberately NOT added to
      # coverageLib.mjs's gated list: it is a one-off simulator whose bulk is `*Run.ts` entry
      # scripts, so a 90% bar there would only buy tests written for the percentage. Running its
      # tests at all is the whole point — they lock in balance numbers (enhance-protect costs,
      # stronghold combat) that engine changes can silently invalidate.
      - name: server econ-sim tests (non-workspace package)
        if: matrix.shard.name == 'rest'
        working-directory: server/tools/econ-sim
        run: npm test

      # coverage-report (below) needs every shard's coverage/ output on one filesystem; each
      # shard only produces coverage dirs for the workspaces it actually ran, so the glob below
      # naturally scopes to just those.
      - name: upload coverage artifact (${{ matrix.shard.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-${{ matrix.shard.name }}
          path: ${{ matrix.shard.coverage_paths }}
          if-no-files-found: ignore
          retention-days: 1

      # Written by scripts/flakyReporter.mjs only when a test failed and then passed on its retry
      # (vitest `retry: 1`, see each vitest.config.ts). Absent on a clean run — `ignore` keeps that
      # from being an error. Kept longer than the coverage artifacts: this is the flake ledger, and
      # a week of history is what makes "is this test getting worse?" answerable.
      - name: upload flaky-test report (${{ matrix.shard.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report-server-${{ matrix.shard.name }}
          path: server/*/flaky-report.json
          if-no-files-found: ignore
          retention-days: 7

  # —— Client: type-check + unit tests + web build —— (own runner, parallel with server-test/tools-test)
  client-test:
    name: client test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # 2026-08-14 fix: client/vitest.config.ts aliases @nw/engine and @nw/shared straight to their
      # server/ TS SOURCE (../server/engine/src, ../server/shared/src/slg/index.ts) rather than the
      # built npm packages — so client's own test run needs server/'s node_modules on disk too (e.g.
      # @nw/shared's slg barrel pulls in jwt.ts -> the `jsonwebtoken` package). The old single job got
      # this for free because "server install" ran earlier in the SAME job/runner; client-test is now
      # a separate runner that never touched server/ at all. First cut of this split skipped this and
      # "client UI smoke tests" failed with "Failed to load url jsonwebtoken ... Does the file exist?"
      # (confirmed via an actual workflow_dispatch run) — plain "client unit tests" happened to pass
      # since none of those specific tests exercise the jwt-touching corner of @nw/shared's barrel.
      - name: server install (client's @nw/engine + @nw/shared aliases resolve to server/ TS source)
        working-directory: server
        run: npm ci
      - name: client install
        working-directory: client
        run: npm ci
      # Client REST codegen staleness check, the counterpart to the six server codegen gates in
      # server-checks above. Added 2026-08-27 after src/net/openapi.ts was found 18 lines behind
      # server/contracts/openapi.yml (the anomaly-report endpoint's device-context and orientation
      # fields) — the spec had them, the bundled openapi.yml had them, nobody re-ran the codegen.
      # gen-openapi.mjs's header says the point of committing the generated file is that drift is
      # "caught at tsc time", and that holds only for endpoints whose types something imports:
      # nothing on the client references operations['reportAnomaly'], so tsc stayed green and no
      # gate anywhere could have noticed. This step is that gate, and it covers all four specs,
      # not just the one that drifted, plus proto (src/net/proto, same exposure — it happened to be
      # in sync). Only half the fix, and deliberately so: ADR-023's 2026-08-08
      # patch hung pre<script> regen hooks on all six SERVER packages and skipped client/, so on the
      # client there was neither an auto-regen nor a check. That gap is the actual root cause.
      - name: client codegen check (openapi*.yml + *.proto -> src/net)
        working-directory: client
        run: |
          npm run rest:gen
          npm run proto:gen
          git diff --exit-code src/net/openapi.ts src/net/openapi-world.ts src/net/openapi-social.ts src/net/openapi-auction.ts src/net/proto
      # claudedocs/client-modules.md "单文件 500 行收敛": same baseline-drift check as the server
      # step above (client/scripts/file-length-baseline.json) — only fails on a NEW file crossing
      # 500 lines or a known baseline file growing past its recorded count. 2026-08-13: schema now
      # requires every baseline entry to carry a written "reason" (checkFileLength.mjs rejects
      # entries without one, and rejects any entry over the 800-line hard cap outright) — a
      # 2026-08-13 audit found 11 of the then-19 entries had accumulated with zero justification,
      # some for 2+ days, before anyone noticed. Those 11 were split out of the baseline entirely
      # (not "documented", actually removed by splitting the files); the 7 remaining entries are
      # genuinely justified exceptions (thin forwarding facades / single shared-state roots).
      - name: client file length check
        working-directory: client
        run: npm run check:filelength
      # ESLint. New step, but not a new script: `npm run lint` existed and had been broken for a
      # while — ESLint reached v9, stopped reading `.eslintrc.js`, and the command died at startup
      # with "couldn't find an eslint.config.*". Nothing reported it because no workflow ever ran
      # it, which is the same "a gate nobody has watched fail is not a gate" problem called out on
      # the cache-policy step below. The config is now flat (client/eslint.config.mjs) and this
      # step is what stops it rotting again. Errors fail the job; the handful of remaining
      # `no-explicit-any` findings are warnings on purpose (see the config) and do not.
      - name: client lint
        working-directory: client
        run: npm run lint
      # vitest (esbuild) and webpack don't type-check, and tsconfig.json's include is src-only,
      # so test/** blueprint/DTO drift stays latent. tsconfig.test.json pulls src + test/** into
      # one program so this step fails on that drift (see CC-1 card-instance migration).
      # `npm run typecheck` runs TWO programs: tsconfig.test.json (client src + tests) and
      # tsconfig.fulllink.json (cross-package: server tests that import the real client net layer,
      # today only auctionsvc's auction-fulllink e2e). The second one is why this job installs
      # server/ deps as well — it needs mongodb + @types/node from server/node_modules alongside
      # client/node_modules, which is the combination no other job has.
      - name: client typecheck (src + tests, and cross-package full-link program)
        working-directory: client
        run: npm run typecheck
      # Always with coverage, on PRs too — see the matching comment on server-test above. The client
      # tax used to be the blocker for that (188s -> 668s under v8), which is exactly why coverage
      # was PR-exempt and why a coverage regression could only be caught after the merge. It is no
      # longer a blocker: the whole-battle simulation suites that carried ~all of that cost moved to
      # client/vitest.sim.config.ts and run WITHOUT instrumentation (still run — `test:coverage`
      # chains them — just not measured; they were worth 0.05pp of coverage, 91.20% -> 91.15%).
      # Net: coverage on every event for roughly the wall clock the uninstrumented run used to take.
      - name: client unit tests (with coverage)
        working-directory: client
        run: npm run test:coverage
      # UI smoke: headless PIXI adapter constructs real scenes in pure Node to prove each scene starts correctly.
      # No Docker / browser / live stack needed, so this lives in the fast path.
      - name: client UI smoke tests
        working-directory: client
        run: npm run test:ui
      - name: client web build
        working-directory: client
        run: npm run build:web

      # Shipped-size budgets (ASSET_PACKAGING §13). Immediately after the build, because it measures
      # the real dist/ output rather than re-deriving what should be in it. Absolute budgets with
      # headroom, NOT a ratchet — scripts/bundle-size-budget.json records why each number is what it
      # is. Exists because the bundle grew ~1.5 MB → 2.08 MB with nothing watching, and because
      # bootManifest.ts's "keep the L0 tier MINIMAL" rule had only a code comment behind it.
      - name: client shipped-size budget
        working-directory: client
        run: npm run check:bundlesize

      # Cache policy on the emitted dist/ (ASSET_PACKAGING §13.1). The rule this enforces was
      # "configured" in the design doc and in nginx.conf for over a year while the file production
      # actually reads — the emitted _headers — did not have it, so every repeat session paid a
      # conditional request per asset. Checks the artifact, not the intent. Both this gate and the
      # size gate have their own mutation tests (test/cachePolicyGate.test.ts,
      # test/bundleSizeGate.test.ts): a gate nobody has watched fail is not a gate.
      - name: client cache policy
        working-directory: client
        run: npm run check:cachepolicy

      # Same flake ledger as the server shards — written only when client's e2e/load configs had to
      # retry a test (the plain unit suite deliberately has no retry; see claudedocs/server.md).
      - name: upload flaky-test report (client)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report-client
          path: client/flaky-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: upload coverage artifact (client)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/**
          if-no-files-found: ignore
          retention-days: 1

  # —— tools: type-check + build + file-length gate —— (own runner, parallel with server-test/client-test)
  tools-test:
    name: tools typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: tools install (animator/level-editor/map-editor/ops/vfx-editor/desktop-shell)
        working-directory: tools
        run: |
          for d in animator level-editor map-editor ops vfx-editor desktop-shell; do
            (cd "$d" && npm ci)
          done
      # ESLint, new on 2026-08-26: none of the five tools had a lint script before that day (nor did
      # server/; client/'s existed but had been failing at startup, unwatched, for months — see
      # claudedocs/client-testing.md). Rules are shared with client/ and server/ via the repo-root
      # eslint.shared.mjs. First run found 6 problems across all five: level-editor, ops and
      # map-editor were already clean; animator had a ternary-as-statement, a stale eslint-disable,
      # an unused handler param, and one genuinely dead command class that turned out to be a
      # missing feature (keyframe drags are not undoable — documented in place, not deleted);
      # vfx-editor had an unused import and one prefer-const the rule was wrong about.
      # desktop-shell has no lint script (it is build-only, like its typecheck).
      - name: tools lint (animator, level-editor, map-editor, ops, vfx-editor)
        working-directory: tools
        run: |
          for d in animator level-editor map-editor ops vfx-editor; do
            (cd "$d" && npm run lint)
          done
      # 2026-08-13 follow-up: animator/level-editor/vfx-editor gained the same typecheck+test
      # scripts as map-editor/ops (io/ split coverage + a bootstrap pure-module test each — see
      # claudedocs/animator.md). desktop-shell remains build-only (webpack ts-loader is its typecheck).
      - name: tools typecheck (animator, level-editor, map-editor, ops, vfx-editor)
        working-directory: tools
        run: |
          for d in animator level-editor map-editor ops vfx-editor; do
            (cd "$d" && npm run typecheck)
          done
      # 2026-08-20 (ADR-070): was `npm test`; now the coverage variant, because tools/* joined the
      # root coverage report and the coverage-report job below needs these artifacts. Same test
      # files and assertions either way — these suites are pure-logic and take ~1s each, so the v8
      # instrumentation tax that forced client's sim-suite split is not a factor here.
      - name: tools unit tests + coverage (animator, level-editor, map-editor, ops, vfx-editor)
        working-directory: tools
        run: |
          for d in animator level-editor map-editor ops vfx-editor; do
            (cd "$d" && npm run test:coverage)
          done
      # All five coverage dirs share the `tools/` ancestor, so this uploads one artifact rooted
      # there and coverage-report downloads it straight back into `tools/` — same rooting trick the
      # server "rest" shard uses for its 11 workspace dirs.
      - name: upload coverage artifact (tools)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-coverage
          path: tools/*/coverage
          if-no-files-found: ignore
          retention-days: 1
      - name: tools build (animator/level-editor/vfx-editor/desktop-shell)
        working-directory: tools
        run: |
          for d in animator level-editor vfx-editor desktop-shell; do
            (cd "$d" && npm run build)
          done
      - name: tools file length check
        working-directory: tools
        run: node scripts/checkFileLength.mjs
      # 2026-08-20: added after animator turned out to be carrying 1424 lines of pre-refactor
      # modules that nothing imported. That graph was invisible to BOTH gates above by
      # construction — every file under 500 lines, and all of them outside every coverage
      # `include` — so nothing here would ever have reported it. See claudedocs/tools-testing.md.
      - name: tools reachability check (no unreachable src files)
        working-directory: tools
        run: node scripts/checkUnreachableModules.mjs

      # tools/audio-pipeline is the one tool that is not a Node app (Python + numpy + soundfile —
      # see its README's "Why Python": libsndfile in a wheel decodes AND encodes OGG/MP3/WAV/FLAC
      # in one dependency, and this repo has no ffmpeg). It landed 2026-08-31..09-01 with a
      # 435-line `selftest.py` of 106 checks — and **nothing in any of the 13 workflows ran it**,
      # so 2100 lines of measurement and gating code had a self-test that could only rot. These
      # two steps are that gap closed; they are the whole Python surface of CI.
      #
      # It needs the repo's committed raw sources (`art/audio/sources/**`, 22 files referenced by
      # `process.PICKS`, all tracked) because its last source-gate case re-measures every one of
      # them. `actions/checkout` above already brings them, so there is nothing to fetch.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/audio-pipeline/requirements.txt
      - name: audio-pipeline deps
        run: python -m pip install -r tools/audio-pipeline/requirements.txt
      # Invoked from the repo root here, but it no longer matters which directory it runs from:
      # `selftest.py` chdirs to the repo root itself (2026-09-02 — before that, running it the way
      # its own docstring said crashed with a LibsndfileError, which is part of why it was never
      # wired up).
      - name: audio-pipeline selftest (measurement, gating, conversion)
        run: python tools/audio-pipeline/selftest.py

  # Reads every server-test shard's + client-test's + tools-test's uploaded coverage/ artifacts
  # (each shard only produced coverage for the workspaces it ran) back onto one filesystem, then
  # renders ONE run-summary section over the lot: verdict in the heading, failures and regressions
  # above the fold, the per-package table collapsed under it. 2026-09-02 merged what used to be
  # two near-identical sections (report + gate table) into that one — see
  # scripts/coverageReport.mjs' renderSection.
  # scripts/coverageSummary.mjs never throws, so `if: always()` + downloading whatever artifacts
  # did get produced lets it still render a (possibly partial) section even if a shard failed.
  # 2026-08-15: runs on PRs too, now that both events produce coverage (see server-test) — the 90%
  # gate below is only a release gate if it can also block the PR that would breach it.
  coverage-report:
    name: test coverage report
    needs: [server-test, client-test, tools-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Each download target below matches how upload-artifact rooted that shard's artifact (see
      # the comments on `coverage_paths` and the upload step in server-test/client-test): the
      # metaserver/worldsvc/client shards each uploaded a single directory's contents (so they're
      # downloaded straight into that same directory), while the "rest" shard uploaded 11 dirs
      # sharing the `server/` ancestor (so it's downloaded back into `server/` to reconstruct each
      # `<pkg>/coverage/` subpath). `if-no-files-found: ignore` on upload plus continue-on-error
      # here means a shard that produced no coverage (e.g. it failed before running) just leaves
      # that package's row as "—" in the report instead of failing this job.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-coverage-metaserver
          path: server/metaserver/coverage
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-coverage-worldsvc
          path: server/worldsvc/coverage
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-coverage-rest
          path: server
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: client-coverage
          path: client/coverage
      # Rooted at tools/ so each `<tool>/coverage/` subpath is reconstructed (see the upload step).
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tools-coverage
          path: tools
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Δ column (2026-09-02): the last green `main` run's per-package numbers, carried between
      # runs by actions/cache. Restore-only here — the save step at the bottom of this job is what
      # publishes a new baseline, and only on a green push to main, so a red run can never poison
      # the numbers every later run is compared against. `key` deliberately cannot match (it
      # carries this run's id); `restore-keys` is a prefix, so what comes back is the most recent
      # entry saved under it. Caches written on the default branch are readable from every branch,
      # which is what lets a PR run compare itself against main; the reverse is not true, which is
      # the other reason PR runs never save.
      #
      # Absent or evicted is the boring path, not a failure: the Δ column renders '—' and the
      # section says so (see readBaseline in scripts/coverageLib.mjs).
      - name: restore coverage baseline (last green main)
        uses: actions/cache/restore@v4
        with:
          path: coverage-baseline.json
          key: coverage-baseline-main-${{ github.run_id }}
          restore-keys: coverage-baseline-main-
      # This step owns the run-summary section outright as of 2026-09-02 — heading, verdict,
      # regressions and the collapsed per-package table. It used to write a `## Test coverage`
      # table and the gate step below appended a SECOND heading with a second full table whose
      # `Lines` column was byte-identical to this one's and whose `Status` column was 19 identical
      # ✅ on any green run, with the verdict as the last line under it. Both steps get their
      # verdict from one `evaluate` call in scripts/coverageLib.mjs, so only one of them has to
      # render it — hence TESTS_OK is passed to BOTH now (this step needs it to print the
      # "not enforced" heading the gate's exit code already honoured).
      #
      # IN and OUT are the same file on purpose: coverageSummary.mjs reads the baseline before it
      # writes the new one, and the cache-save step below is what decides whether the new one
      # counts.
      - name: coverage report (run summary)
        env:
          TESTS_OK: ${{ needs.server-test.result == 'success' && needs.client-test.result == 'success' && needs.tools-test.result == 'success' }}
          COVERAGE_BASELINE_IN: coverage-baseline.json
          COVERAGE_BASELINE_OUT: coverage-baseline.json
        run: node scripts/coverageSummary.mjs
      # Hard gate (2026-08-15): fails this job — and therefore blocks every *-deploy.yml, which
      # gates on `workflow_run.conclusion == 'success'` — if any package's line coverage drops
      # below 90%. Deliberately a separate step/script from the report above: that one must never
      # fail (see its own header comment), this one must always fail below the bar. Since
      # 2026-09-02 that exit code is ALL it contributes — the run-summary section is the report
      # step's, and this step's own output goes to its log. See scripts/checkCoverageThreshold.mjs
      # and claudedocs/server-testing-tooling.md "测试覆盖率百分比工具".
      #
      # 2026-09-03: BRANCH coverage is now gated at 90% too, on its own bar. It had never been
      # gated, and measuring the column found every package over the line bar with 7 of the 13
      # server packages under 90% on branches — so this step goes red until those land. The bar is
      # a single global knob, not a per-package exemption list (ADR-070 Phase 4e retired that
      # mechanism deliberately): if a deploy is genuinely needed before the backfills are done,
      # lower it here, visibly and temporarily, with COVERAGE_BRANCH_THRESHOLD.
      #
      # TESTS_OK breaks the cascade that made every shard failure report TWICE and hid its own cause:
      # a failed shard produces no coverage/ artifact, the gate then failed with "no coverage/ output
      # found for server/metaserver" (run 31887181835), and that second, louder red is what people
      # read — while the actual cause was one flaky e2e case three jobs away. When a test job failed,
      # the run is already red and no deploy can fire, so the gate has nothing left to protect: it
      # reports the partial table and exits 0. It still fails closed on a MISSING package when all
      # test jobs passed — that case really is "coverage silently stopped being produced".
      # tools-test joined TESTS_OK (2026-08-20, ADR-070): the tools/* rows are exempt from the 90%
      # PERCENTAGE but not from having to produce coverage at all, so a failed tools-test job must
      # suppress the "no coverage/ output for tools/ops" failure the same way it already does for a
      # failed server shard — otherwise one red tools test reports itself twice, with the louder,
      # wronger message winning (the exact cascade the TESTS_OK comment above was added to break).
      - name: enforce >=90% line and branch coverage per package
        env:
          TESTS_OK: ${{ needs.server-test.result == 'success' && needs.client-test.result == 'success' && needs.tools-test.result == 'success' }}
        run: node scripts/checkCoverageThreshold.mjs
      # Publishes this run's numbers as the baseline every later run's Δ column is read against.
      # Three conditions, each load-bearing: `success()` so a run that just failed the gate cannot
      # become the thing future runs are compared favourably against; push-to-main so a PR cannot
      # move the reference out from under the PRs beside it; and a run-id-suffixed key because
      # cache entries are immutable — same key, no overwrite, silently stale forever.
      - name: save coverage baseline
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: coverage-baseline.json
          key: coverage-baseline-main-${{ github.run_id }}

  # Slow path: docker compose brings up the full stack (mongo + meta + commercial + gateway + matchsvc + game),
  # then runs the real client orchestration core (createAppCore) as a Node process on the runner host for full end-to-end tests.
  e2e:
    name: full-link E2E (live stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI uses fixed weak keys (the stack is ephemeral and not exposed to the public internet). Production injects strong random strings via .env.
      NW_JWT_SECRET: ci-jwt-secret
      NW_INTERNAL_KEY: ci-internal-key
      NW_ADMIN_JWT_SECRET: ci-admin-jwt-secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: client install
        working-directory: client
        run: npm ci

      # Bring up the full stack and wait for all services to be healthy (--wait works with healthchecks in compose). Caddy is not started.
      - name: bring up server stack
        working-directory: server
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml \
            up -d --build --wait \
            redis mongo metaserver commercial gateway matchsvc gameserver worldsvc analyticsvc

      # SLG worldsvc deployment smoke (S8-0): proves the 7th process starts in the prod image and the public REST 4th face is reachable.
      - name: worldsvc health smoke
        run: curl -fsS http://localhost:18084/health

      # analyticsvc deployment smoke (A9-1): proves the 9th process starts in the prod image.
      - name: analyticsvc health smoke
        run: curl -fsS http://localhost:18085/health

      - name: run full-link E2E
        working-directory: client
        env:
          NW_API_BASE: http://localhost:18080
          NW_EXPECT_GATEWAY: ws://localhost:8086/gw
        run: npm run test:e2e

      # Capacity smoke: small fleet (20 clients) against the live stack, verifying matchmaking holds under concurrency.
      # Real capacity probing is done locally / in a dedicated environment with a larger NW_LOAD_CLIENTS value.
      - name: run ranked load smoke (small fleet)
        working-directory: client
        env:
          NW_API_BASE: http://localhost:18080
          NW_LOAD_CLIENTS: '20'
        run: npm run test:load

      # Browser smoke (claudedocs/client-testing.md 缺口B): the only layer with a real renderer /
      # real WebGL, driven via window.__nwE2E (see entries/web-e2e.ts) instead of pixel clicks.
      # Reuses the stack already brought up above — no separate docker-compose bring-up. New as of
      # 2026-07-22: continue-on-error until it's proven stable across a run of PRs, then remove the
      # flag to make it a hard merge gate (this is the day-branch → main PR gate, chosen precisely
      # because this job's stack cost is too high to pay on every feature-branch merge).
      - name: install Playwright chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: run browser smoke (two-account, real WebGL)
        id: browser_smoke
        working-directory: client
        continue-on-error: true
        run: npm run test:browser

      # continue-on-error above means `failure()` never sees this step fail — check its recorded
      # outcome directly instead, or this upload (and the trial-period signal) would never fire.
      - name: upload Playwright report on failure
        if: steps.browser_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

      # Dump full stack logs on failure to aid diagnosis (ports / handshakes / matchmaking queue).
      - name: dump server logs on failure
        if: failure()
        working-directory: server
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs --no-color --tail=400

      - name: tear down server stack
        if: always()
        working-directory: server
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml down -v
