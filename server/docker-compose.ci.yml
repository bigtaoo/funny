# CI overlay (merged with docker-compose.prod.yml). For running full end-to-end link in GitHub Actions
# (.github/workflows/ci.yml job `e2e`; scripts/e2e-local.sh replays the same steps on a dev machine):
#   docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up -d --build --wait \
#       redis mongo metaserver commercial gateway matchsvc gameserver worldsvc analyticsvc auctionsvc caddy
#
# Differences from prod (solely to serve "E2E running as Node process directly on the runner host"):
#   • Two ways in. The Node-process suites (test:e2e, test:load) connect directly to each service's
#     host-mapped port. The browser smoke (test:browser) goes through caddy, on ONE origin, exactly
#     like a production web client: the client derives several bases from its API base by path
#     (analytics = API base minus `/api`, see client/src/analytics/index.ts), and only the real
#     Caddyfile routes those paths to the right process. Pointed straight at metaserver instead,
#     `GET /analytics/config` lands on metaserver's 501 stub (metaserver/src/service/telemetry.ts).
#     caddy keeps its prod Caddyfile; only its host port and container name change (below), and it
#     pulls in auctionsvc/socialsvc through its prod depends_on — the services its routes point at.
#   • Exposes meta REST / gateway public WS / game data-plane WS / worldsvc / analyticsvc to host ports, matching the
#     defaults expected by client/test/e2e/full-link.e2e.ts (meta 18080 / gateway 8086 / game 8081).
#   • The gateway address sent by meta + the game address in tickets both use localhost:<host-port>,
#     so E2E processes on the runner can connect using the server-provided address (validates the core assertion "client connects to the right port").
#   • Adds Node-based healthchecks to all services (image has node, not curl), compatible with `--wait` for deterministic readiness.
#
# Host-side ports and the two fixed container names are overridable so the same stack can run on a machine where a
# default is already taken (e.g. another project's container on 18080). Unset = the values CI has always used:
#   NW_E2E_META_PORT       18080   metaserver REST            (container 8080)
#   NW_E2E_GATEWAY_PORT    8086    gateway public WS          (container 8082) — also baked into NW_GATEWAY_PUBLIC_WS_URL
#   NW_E2E_GAME_PORT       8081    gameserver data-plane WS   (container 8081) — also baked into NW_GAME_PUBLIC_WS_URL
#   NW_E2E_WORLD_PORT      18084   worldsvc public REST       (container 18084)
#   NW_E2E_ANALYTICS_PORT  18085   analyticsvc                (container 18085)
#   NW_E2E_PROXY_PORT      18088   caddy, the single origin   (container 80) — client/playwright.config.ts reads it too
#   NW_E2E_CONTAINER_PREFIX nw     container_name of redis/mongo/caddy (prod pins `nw-redis` / `nw-mongo` / `nw-caddy`; those names are
#                                  global on the Docker host, so a second stack under another `-p` project collides
#                                  with any leftover container of that name unless this is changed)
services:
  redis:
    container_name: ${NW_E2E_CONTAINER_PREFIX:-nw}-redis
    # CI uses in-memory mode, no volume; healthcheck lets --wait wait deterministically.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    container_name: ${NW_E2E_CONTAINER_PREFIX:-nw}-mongo

  metaserver:
    environment:
      # Client connects to this address for room/matchmaking; E2E asserts gateway socket uses this, not meta base.
      NW_GATEWAY_PUBLIC_WS_URL: ws://localhost:${NW_E2E_GATEWAY_PORT:-8086}/gw
      # CI: all requests come from the same IP; disable rate limiting to prevent E2E + load smoke tests consuming each other's auth quota.
      NW_AUTH_RATE_LIMIT: '0'
    ports:
      - "${NW_E2E_META_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  commercial:
    environment:
      # CI stack runs the prod image (Dockerfile hard-codes NODE_ENV=production), but CI has no real payment credentials.
      # Full-link E2E recharge assertions rely on the `tier:` dev stub. The L2-3 hardening under NODE_ENV=production
      # force-disables the dev stub (iap.ts) and refuses startup with NW_IAP_DEV=true (index.ts), so the only option is
      # to opt commercial out of production mode: NODE_ENV != production → missing credentials auto-fall back to dev stub,
      # without changing any line of the prod hardening itself.
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8092/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  gateway:
    ports:
      - "${NW_E2E_GATEWAY_PORT:-8086}:8082"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  matchsvc:
    environment:
      # Data-plane fallback address changed to runner host-reachable (used before gameserver registers + written into ticket fallback).
      NW_GAME_PUBLIC_WS_URL: ws://localhost:${NW_E2E_GAME_PORT:-8081}/ws
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8091/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  gameserver:
    environment:
      # Data-plane address written into ticket for client → runner host-reachable.
      NW_GAME_PUBLIC_WS_URL: ws://localhost:${NW_E2E_GAME_PORT:-8081}/ws
    ports:
      - "${NW_E2E_GAME_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8081/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  worldsvc:
    # SLG public REST fourth face: mapped to host, directly reachable by E2E/curl (meta/gateway don't proxy world).
    ports:
      - "${NW_E2E_WORLD_PORT:-18084}:18084"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18084/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  analyticsvc:
    ports:
      - "${NW_E2E_ANALYTICS_PORT:-18085}:18085"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18085/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  socialsvc:
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8085/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  auctionsvc:
    # Joined the CI stack with caddy (a /auction route target and one of caddy's prod depends_on), so it
    # gets the same healthcheck as the others for a deterministic --wait.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18086/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  caddy:
    container_name: ${NW_E2E_CONTAINER_PREFIX:-nw}-caddy
    environment:
      # The Caddyfile's /ops/* matcher is `header X-Ops-Proxy-Secret {$NW_OPS_PROXY_SECRET}`; with
      # the variable empty it has a field and no value, and caddy refuses the whole config
      # ("malformed header matcher") and restart-loops. prod.yml's caddy does not pass it at all
      # (docker-compose.cloud.yml does), so CI supplies a fixed weak value like its other keys. admin
      # is not in this stack, so /ops/* has nothing behind it either way.
      NW_OPS_PROXY_SECRET: ci-ops-proxy-secret
    # !override, not a merge: prod publishes 80/443/443-udp, and an overlay's `ports` list is
    # appended to the base one — a CI runner would then try to bind 80 and 443 as well.
    ports: !override
      - "${NW_E2E_PROXY_PORT:-18088}:80"
    healthcheck:
      # The Caddyfile's catch-all `handle` answers 200; busybox wget ships in the caddy image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 10
