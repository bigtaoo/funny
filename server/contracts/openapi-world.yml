            schema:
              type: object
              required: [worldId, nomineeFamilyId]
              properties:
                worldId: { type: string }
                nomineeFamilyId: { type: string }
      responses:
        '200':
          description: Vote tallied
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SectVoteResult' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /sect/emblem:
    post:
      operationId: setSectEmblem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId, emblemKey, emblemColor]
              properties:
                worldId: { type: string }
                emblemKey: { type: string, description: 'One of @nw/shared EMBLEM_KEYS' }
                emblemColor: { type: integer, description: 'One of @nw/shared EMBLEM_COLORS' }
      responses:
        '200':
          description: Emblem updated (sect leader only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /sect/message:
    post:
      operationId: sendSectMessage
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId, body]
              properties:
                worldId: { type: string }
                body: { type: string }
                senderName: { type: string }
      responses:
        '200':
          description: Message sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SectMessageView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /sect/channel:
    get:
      operationId: getSectChannel
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: worldId, in: query, required: true,  schema: { type: string } }
        - { name: before,  in: query, required: false, schema: { type: number } }
        - { name: limit,   in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: Channel messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SectMessageView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }
