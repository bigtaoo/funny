openapi: 3.1.0
info:
  title: Notebook Wars — worldsvc REST API
  version: "1.0"
  description: >
    SLG world map (worldsvc) REST contract. Separated from the metaserver openapi.yml because worldsvc runs at a different base URL.
    The client generates src/net/openapi-world.ts via gen-openapi.mjs.

servers:
  - url: '{worldBase}'
    variables:
      worldBase:
        default: 'http://localhost:18084'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    # ── World ──────────────────────────────────────────────────────────────────

    WorldTileView:
      type: object
      required: [x, y, type, level]
      properties:
        x:
          type: integer
        y:
          type: integer
        type:
          type: string
          enum: [neutral, resource, territory, familyKeep, center, base, obstacle, bridge, plankway, stronghold]
        level:
          type: integer
        resType:
          type: string
          enum: [ink, paper, graphite, metal, sticker]
        obstacleKind:
          type: string
          enum: [river, mountain]
          description: >-
            For type=obstacle only: river vs mountain art (§24). Carried from the per-world terrain baseline
            (mapBaselines, cloned from the active map template) or proceduralTile, so map-editor-painted rivers/mountains
            render correctly on the client instead of the client re-deriving a possibly-different kind locally.
        occupied:
          type: boolean
        mine:
          type: boolean
        ownerPublicId:
          type: string
          description: Occupier's 9-digit public id (populated when meta service is available)
        ownerName:
          type: string
          description: Occupier's display name (populated when meta service is available)
        familyId:
          type: string
        garrison:
          type: integer
        hp:
          type: integer
          description: >-
            ADR-026 §1: current building HP of this attackable tile (main base anchor / territory / stronghold). Absent = full HP (client falls back to maxHp).
            Populated for occupied/attackable tiles within vision.
        maxHp:
          type: integer
          description: "ADR-026 §1: building max HP = level × SLG_BASE_HP_PER_LEVEL. Client renders the HP bar as hp/maxHp."
        protectedUntil:
          type: number
        contestedUntil:
          type: number
          description: >-
            ADR-037 (§5.4): this tile is mid occupation-hold — an occupy march won its PvE battle against the
            system garrison but the hold countdown has not yet elapsed (no owner yet). ms epoch when the hold
            resolves into ownership, unless expelled first by another attack/occupy march.
        contestedByMe:
          type: boolean
          description: "ADR-037 (§5.4): the pending occupier is the requester themself (\"I'm holding\" vs. \"someone else is holding\")."
        watchtower:
          type: boolean
          description: §18 G5 V2：A watchtower has been built on this tile (large-radius persistent vision source). The client renders the tower marker.
        structure:
          $ref: '#/components/schemas/TileStructureView'
        visible:
          type: boolean
          description: >-
            G5 vision: whether this tile is within the requester's current field of view. true = dynamic layer returned as-is; false = outside vision range, only the procedurally-generated
            base terrain is returned (all dynamic-layer data hidden, including the "occupied" signal). Populated only for /world/map viewport reads.
        ally:
          type: boolean
          description: "G5: this tile is owned by a family ally (within vision, not self). Client renders with friendly colour."
        sectmate:
          type: boolean
          description: >-
            2026-08-08: this tile is owned by a member of the requester's own sect who is NOT in the requester's family (within vision, not self, not family — that's `ally`;
            not an allied-sect member — that's `allySect`). Does not share vision (only family does, DECISIONS §18.6); client renders a third "friendly but not family" colour.
        allySect:
          type: boolean
          description: >-
            G5: this tile is owned by a member of an allied sect of the player's own sect (within vision, not self, not family). Alliances do not share vision;
            distinguished on the map with its own colour + a yellow border (§8.2, attacking/capturing between allies is forbidden).
        deskLevel:
          type: integer
          description: >-
            Main-base anchor only: owner's `desk` building level (1-10), mirrored from playerWorld onto the anchor
            tile whenever a desk upgrade completes. Drives the player-base art frame (playerbase_l{n}) on the
            requester's own base tile (see design/product/player-base-image-prompts.md); absent = level 1.

    WorldMapView:
      type: object
      required: [worldId, cx, cy, r, tiles]
      properties:
        worldId:
          type: string
        cx:
          type: integer
        cy:
          type: integer
        r:
          type: integer
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/WorldTileView'

    WorldTileSparseView:
      description: >-
        Sparse occupied-tile view (zoom 2/3 bird's-eye layer). Contains only occupied tiles; unoccupied tiles are rendered locally by the client from proceduralTile.
        No profile RPC, no vision calculation.
      type: object
      required: [x, y, type]
      properties:
        x:
          type: integer
        y:
          type: integer
        type:
          type: string
          enum: [neutral, resource, territory, familyKeep, center, base, obstacle, bridge, plankway, stronghold]
        mine:
          type: boolean
        ally:
          type: boolean
          description: "lod=mid: same-family ally"
        sectmate:
          type: boolean
          description: "lod=mid: same-sect member, not family"
        allySect:
          type: boolean
          description: "lod=mid: allied sect member (not family)"

    WorldMapSparseView:
      type: object
      required: [worldId, cx, cy, r, lod, tiles]
      properties:
        worldId:
          type: string
        cx:
          type: integer
        cy:
          type: integer
        r:
          type: integer
        lod:
          type: string
          enum: [thin, mid]
        tiles:
          type: array
          description: Occupied tiles only, sparse array
          items:
            $ref: '#/components/schemas/WorldTileSparseView'

    ShardTransferTargetView:
      description: A candidate destination shard for mid-season transfer (G6/§27) — same season, open/active, not full.
      type: object
      required: [worldId, shard, population, capacity]
      properties:
        worldId:
          type: string
        shard:
          type: integer
        population:
          type: integer
        capacity:
          type: integer

    PlayerWorldView:
      type: object
      required: [joined]
      properties:
        joined:
          type: boolean
        worldId:
          type: string
          description: "The shard worldId the player belongs to (G6/§20: returned from join-season resolution; the client uses this to enter the world)"
        troops:
          type: integer
        troopCap:
          type: integer
        resources:
          type: object
          additionalProperties:
            type: number
        yieldRate:
          type: object
          additionalProperties:
            type: number
        mainBaseTile:
          type: string
        familyId:
          type: string
        territoryCount:
          type: integer
        hasBattlePass:
          type: boolean
          description: "Season battle pass held (S8-8 shop; grants training/build speed + yield bonuses, cleared on season reset). Client uses this to grey out the shop's battle-pass row once already active (single-slot — repeat purchase is rejected with ALREADY_ACTIVE)."
        trainingQueue:
          type: array
          description: Training queue (S8-2, ordered by completeAt ascending). The client uses this to render the queue countdown (C4).
          items:
            type: object
            required: [qty, startAt, completeAt]
            properties:
              qty:
                type: integer
              startAt:
                type: integer
                format: int64
              completeAt:
                type: integer
                format: int64
        buildings:
          type: object
          description: "Home-city building levels (SLG_CITY_DESIGN P1; desk≥1, others≥0 when present). Keys are BuildingKey values."
          additionalProperties:
            type: integer
        buildQueue:
          type: array
          description: Build queue (SLG_CITY_DESIGN §4, ordered by completeAt ascending). The client CityScene renders countdowns from this.
          items:
            type: object
            required: [key, toLevel, startAt, completeAt]
            properties:
              key:
                $ref: '#/components/schemas/BuildingKey'
              toLevel:
                type: integer
              startAt:
                type: integer
                format: int64
              completeAt:
                type: integer
                format: int64
        # CC-4: per-card SLG run-time state (CHARACTER_CARDS_DESIGN §8.4). Absent when player has no card state yet.
        cardState:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CardSLGState'
          description: Map of cardInstanceId → CardSLGState (troops, injury, teamId)
        # ADR-026 §5: per-team injury state (team granularity, distinct from CC-3 card-level cardState[].injuredUntil).
        # Absent when no team is injured. Client renders an injury countdown in the team menu; injured teams never defend.
        teamState:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TeamSLGState'
          description: Map of teamId (t1..t5) → TeamSLGState. Present only for teams with active state.
        hp:
          type: integer
          description: >-
            D-CITY-8: own main base's current persistent durability, same field name/semantics as WorldTileView.hp
            (wall-level-derived cap, self-regenerating). Absent when the player has no resolved main base yet.
        maxHp:
          type: integer
          description: "D-CITY-8: own main base's durability cap (= baseDurabilityMax(wall level)). Client renders the durability bar as hp/maxHp."
        speedupUntil:
          type: integer
          format: int64
          description: >-
            S8-8 fix (2026-08-08): train-speedup shop buff end time (ms epoch) — while in the future, the
            training queue advances at 2x real-time speed (TRAIN_SPEEDUP_BUFF_MULT). Present whenever the
            player has ever bought a speedup, even once expired; client compares against Date.now() itself
            (same contract as WorldTileView.protectedUntil) to render a HUD countdown/icon.
        baseProtectedUntil:
          type: integer
          format: int64
          description: >-
            S8-8 UI fix (2026-08-08): mirror of the main base anchor tile's protection-shield end time
            (ms epoch; see WorldTileView.protectedUntil), so the HUD can render a shield countdown without
            depending on the base tile being in the current map viewport. Absent when the base has never
            been shielded.

    BuildingKey:
      type: string
      description: "Home-city building identifier (SLG_CITY_DESIGN). P1 buildable: desk/inkPot/paperTray/graphiteMill/metalForge/stickerShop/cabinet/drillYard; wall/academy are P2."
      enum: [desk, inkPot, paperTray, graphiteMill, metalForge, stickerShop, cabinet, drillYard, wall, academy, satchel]

    MarchView:
      type: object
      required: [marchId, kind, fromTile, toTile, troops, departAt, arriveAt, status]
      properties:
        marchId:
          type: string
        kind:
          type: string
          enum: [attack, reinforce, occupy, sweep, return, move]
        fromTile:
          type: string
        toTile:
          type: string
        troops:
          type: integer
        departAt:
          type: number
        arriveAt:
          type: number
        status:
          type: string
          enum: [marching, returning, arrived]
        mine:
          type: boolean
          description: "G5: whether this march belongs to the requester (false = enemy march within vision range)"
        teamId:
          type: string
          description: "ADR-026: which team slot ('t1'..'t5') this march deployed, if any. Only present on the requester's own marches; used client-side to grey out busy teams in the team picker."
        leaderUnitType:
          type: string
          description: "March-token art (2026-07-26): the deployed team's leader unit-type (engine UnitType string, e.g. 'infantry'/'archer'/'max'), resolved server-side once at dispatch and frozen onto the march. Present for own AND enemy marches (reveals only a unit-type enum, not team/card identity). Absent on flat-troop marches (no team attached)."
        emblemKey:
          type: string
          description: "Map-token corner badge (family-emblem-art-prompts.md, 2026-08-14): the march owner's family emblem, resolved live per-response (not frozen at dispatch, unlike leaderUnitType — family identity isn't sensitive). Absent if the owner has no family or the family has no badge chosen."
        emblemColor:
          type: integer

    OccupationView:
      type: object
      required: [tile, x, y, level, garrison, dueAt]
      properties:
        tile:
          type: string
        x:
          type: integer
        y:
          type: integer
        level:
          type: integer
        garrison:
          type: integer
        dueAt:
          type: number
        teamId:
          type: string
          description: "Which team slot ('t1'..'t5') is tied up holding this tile, if the march was dispatched with one."
        leaderUnitType:
          type: string
          description: "March-token art (2026-07-26): carried over from the winning march's leaderUnitType — see MarchView.leaderUnitType."
        emblemKey:
          type: string
          description: "Map-token corner badge — see MarchView.emblemKey. getOccupations is own-holds-only, so this is always the requester's own family badge."
        emblemColor:
          type: integer

    # ADR-051 (P5): a player-built structure overlaid on a tile (arrowTower / blocker). Rendered map-wide
    # (public static layer); hp/hpMax are intel-gated (omitted for tiles outside the requester's vision).
    TileStructureView:
      type: object
      required: [kind, level]
      properties:
        kind:
          type: string
          enum: [arrowTower, blocker]
          description: "arrowTower: chips passing enemies over its 3×3 footprint (no stop). blocker: hard path obstacle enemies must destroy."
        level:
          type: integer
        hp:
          type: integer
          description: "Current durability (intel-gated — omitted out of vision). Reduced only by an attack march; 0 → removed."
        hpMax:
          type: integer
          description: "Max durability (intel-gated — omitted out of vision)."
        mine:
          type: boolean
          description: "Whether the requester built this structure (client shows Demolish only on own structures)."

    # Stationed team (2026-07-23): a team parked on a tile, standing idle until moved or recalled.
    # ADR-051 (P4): now also carries ENEMY stationed teams within the requester's vision (mine=false),
    # so the client can render enemy field troops + their garrison defense zones. Own teams: mine=true.
    StationedView:
      type: object
      required: [tile, x, y, teamId, troops, sinceAt]
      properties:
        tile:
          type: string
        x:
          type: integer
        y:
          type: integer
        teamId:
          type: string
          description: "Team slot ('t1'..'t5') stationed on this tile."
        troops:
          type: integer
          description: "Troop count carried when the team arrived (display; recall refund for flat armies)."
        sinceAt:
          type: number
          description: "ms the team became stationed."
        mode:
          type: string
          enum: [idle, garrison]
          description: "ADR-051 (P3a): 停留 idle (free, defends own cell) vs 驻扎 garrison (busy, defends its 3×3 footprint). Absent → idle."
        mine:
          type: boolean
          description: "ADR-051 (P4): whether this stationed team belongs to the requester (false = enemy stationed team within vision). Absent → treat as own (legacy). teamId is blanked for enemy teams (not the requester's slot)."
        leaderUnitType:
          type: string
          description: "March-token art (2026-07-26): carried over from the originating march's leaderUnitType — see MarchView.leaderUnitType. Not blanked for enemy teams (reveals only a unit-type enum, not team/card identity)."
        emblemKey:
          type: string
          description: "Map-token corner badge — see MarchView.emblemKey. Present for own AND enemy stationed teams (family identity isn't sensitive, unlike teamId)."
        emblemColor:
          type: integer

    # ── Sect (S8-4b) ────────────────────────────────────────────────────────────

    SectView:
      type: object
      required: [sectId, worldId, name, tag, leaderFamilyId, leaderId, memberFamilyCount, allySectIds, prosperity]
      properties:
        sectId:
          type: string
        worldId:
          type: string
        name:
          type: string
        tag:
          type: string
        leaderFamilyId:
          type: string
        leaderId:
          type: string
        memberFamilyCount:
          type: integer
        allySectIds:
          type: array
          items:
            type: string
        prosperity:
          type: number
        emblemKey:
          type: string
          description: >-
            Sect badge, one of the 24-design fixed pool (see @nw/shared EMBLEM_KEYS, same pool families choose
            from); absent = no badge chosen yet. Sect-leader-only (POST /sect/emblem).
        emblemColor:
          type: integer
          description: Accent colour (one of @nw/shared EMBLEM_COLORS) the emblem art is tinted with; absent while emblemKey is absent.

    SectMemberFamilyView:
      type: object
      required: [familyId, name, tag, leaderId, memberCount, territoryCount]
      properties:
        familyId:
          type: string
        name:
          type: string
        tag:
          type: string
        leaderId:
          type: string
        memberCount:
          type: integer
        territoryCount:
          type: integer
        emblemKey:
          type: string
          description: Family badge (mirrored from socialsvc's FamilyView); absent = no badge chosen yet.
        emblemColor:
          type: integer
          description: Accent colour the emblem art is tinted with; absent while emblemKey is absent.

    SectDetailView:
      allOf:
        - $ref: '#/components/schemas/SectView'
        - type: object
          required: [memberFamilies]
          properties:
            memberFamilies:
              type: array
              items:
                $ref: '#/components/schemas/SectMemberFamilyView'
            removalVote:
              type: object
              required: [nomineeFamilyId, voteCount, needed]
              properties:
                nomineeFamilyId:
                  type: string
                voteCount:
                  type: integer
                needed:
                  type: integer

    SectMessageView:
      type: object
      required: [id, senderId, senderName, body, ts]
      properties:
        id:
          type: string
        senderId:
          type: string
        senderName:
          type: string
        title:
          type: string
          description: Sender's equipped title (称号), if any.
        sectName:
          type: string
          description: Sender's sect name (宗门), if any.
        familyName:
          type: string
          description: Sender's family name (家族), if any.
        body:
          type: string
        ts:
          type: number

    SectVoteResult:
      type: object
      required: [passed, voteCount, needed]
      properties:
        passed:
          type: boolean
        voteCount:
          type: integer
        needed:
          type: integer

    # ── Nation / Season / Shop / Siege (S8-6.5 ~ S8-8) ──────────────────────────

    NationView:
      type: object
      required: [capitalIdx, x, y]
      properties:
        capitalIdx:
          type: integer
          description: 0~9, province index (6 outer + 3 resource + 1 core, ADR-034 angle-sector ring layout)
        x:
          type: integer
        y:
          type: integer
        ownerId:
          type: string
        familyId:
          type: string
        nationName:
          type: string
        foundedAt:
          type: number

    SeasonView:
      type: object
      required: [worldId, season, shard, status, openAt, capacity, population, mapW, mapH]
      properties:
        worldId:
          type: string
        season:
          type: integer
        shard:
          type: integer
        status:
          type: string
          enum: [open, active, settling, closed]
        openAt:
          type: number
        resetAt:
          type: number
        capacity:
          type: integer
        population:
          type: integer
        mapW:
          type: integer
        mapH:
          type: integer

    SlgShopItemView:
      type: object
      required: [id, cost, kind, effect, description]
      properties:
        id:
          type: string
        cost:
          type: integer
          description: Price in coins
        kind:
          type: string
          enum: [troop_speedup, resource_pack, protection, battle_pass]
        effect:
          type: object
          additionalProperties: true
        description:
          type: string

    # Siege defense level that the attacker can play against (C2 post-match review). The level shape matches the client LevelDefinition (loose object);
    # its seed is derived from siegeId; the client must play the level in siege mode with this seed before uploading the recording for re-simulation.
    # Siege spectator replay level (G3-2c): LevelDefinition rebuilt from seed + both sides' formations; client headlessly replays with the same seed.
    SiegeReplayView:
      type: object
      required: [siegeId, seed, outcome, level, attackerName, defenderName]
      properties:
        siegeId: { type: string }
        seed: { type: integer }
        outcome: { type: string, enum: [attacker_win, defender_win, draw] }
        level:
          type: object
          additionalProperties: true
        # Display names for the replay's base plates / viewpoint tag (§16.3). attacker = owner0 = bottom,
        # defender = owner1 = top. Empty string when unresolved (meta down) or PvE defender (stronghold /
        # crossing / ownerless building) — the client falls back to a generic placeholder.
        attackerName: { type: string }
        defenderName: { type: string }
        # 2026-08-12 fix: the attacker's card/equipment/academy inputs the REAL settlement fed into
        # buildSiegeBlueprints — without these, the client's headless re-simulation falls back to plain
        # baseline blueprints for a card-army battle, able to show a different winner than `outcome`.
        # Absent for a flat/synthesized-army battle report, or a legacy record predating this fix.
        cardInstances:
          type: array
          items: { type: object, additionalProperties: true }
        equipmentInv:
          type: object
          additionalProperties: true
        siegeAcademy:
          type: object
          required: [hp, damage, siege]
          properties:
            hp: { type: number }
            damage: { type: number }
            siege: { type: number }

    # Compact battle-report row for the recent-sieges replay browser (last-100). role/hasReplay are relative
    # to the requester; only replayable rows (hasReplay=true) can be opened via GET /world/siege/{id}/replay.
    SiegeSummaryView:
      type: object
      required: [siegeId, tile, outcome, role, ts, hasReplay]
      properties:
        siegeId: { type: string }
        tile: { type: string, description: "Target tile id (worldId:x:y)" }
        tileLevel: { type: integer, description: Target tile level (absent for legacy reports) }
        outcome: { type: string, enum: [attacker_win, defender_win, draw] }
        role: { type: string, enum: [attacker, defender], description: Requester's side in this battle }
        ts: { type: integer, description: Unix ms timestamp the battle resolved }
        hasReplay: { type: boolean, description: Whether a headless replay is available for this report }

    # CC-3: per-card SLG run-time state stored in PlayerWorldDoc.cardState (CHARACTER_CARDS_DESIGN §7).
    CardSLGState:
      type: object
      required: [currentTroops]
      properties:
        currentTroops: { type: integer, description: Troops currently allocated to this card }
        injuredUntil: { type: integer, nullable: true, description: Unix ms timestamp when injury ends; null = not injured }
        teamId: { type: string, nullable: true, description: Team this card is assigned to }

    # ADR-026 §5: per-team SLG run-time state stored in PlayerWorldDoc.teamState (team granularity).
    TeamSLGState:
      type: object
      properties:
        injuredUntil: { type: integer, nullable: true, description: Unix ms timestamp when the team's injury lock ends; null/absent = not injured. Injured teams never defend. }

    # Formation unit (mirrors GarrisonEntry + CC-3 cardInstanceId, G3-2c). Validity of unitType/col/row is checked by the engine levelSchema;
    # initialHp = troops allocated to this unit (= HP, §16.1); cardInstanceId = CC-3 primary key (replaces unitType for new armies).
    ArmyEntry:
      type: object
      required: [col, row]
      properties:
        cardInstanceId: { type: string, description: CC-3 primary key (character card instance) }
        unitType: { type: string, description: Legacy unit type (synthesis/replay paths only) }
        col: { type: integer }
        row: { type: integer }
        initialHp: { type: integer, description: Legacy initial HP for replay data }

    # Attack formation template (team, G3-2c, ≤ 5 teams). A march attaches one team → the army snapshot is stored with the march.
    TeamTemplate:
      type: object
      required: [id, name, army]
      properties:
        id: { type: string }
        name: { type: string }
        army:
          type: array
          items: { $ref: '#/components/schemas/ArmyEntry' }
        autoReturn:
          type: boolean
          description: "2026-07-23: when true, this team marches home after a 'move' arrival / occupy capture instead of staying stationed on the tile (default false = stay in place)."
        leaderCardId:
          type: string
          description: "2026-07-25: the team's leader — a cardInstanceId that MUST also appear in `army`; the server clears it otherwise. Purely an identity marker today (its portrait is the team's icon in the city/world-map team lists); absent = the client falls back to the strongest card in the army."

    # Defense config = constrained subset of the engine LevelDefinition (garrison/defenderBuildings/defenderBaseLevel).
    # Shape is constrained by the client's own meta mirror; the contract layer uses a loose object (to avoid duplicating the engine schema).
    DefenseConfig:
      type: object
      additionalProperties: true

    # ── Shared response wrappers ───────────────────────────────────────────────

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    MarchIdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string

  responses:
    ErrorResp:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            required: [ok, error]
            properties:
              ok: { type: boolean, enum: [false] }
              error: { $ref: '#/components/schemas/Error' }

paths:

  # ── World ──────────────────────────────────────────────────────────────────

  /world/active-season:
    get:
      operationId: getActiveSeason
      summary: "Return the current active SLG season number (§20.8). Public endpoint — no auth required."
      responses:
        '200':
          description: Active season
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [season]
                        properties:
                          season:
                            type: integer
                            description: Current active SLG world season number

  /world/map:
    get:
      operationId: getWorldMap
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: worldId, in: query, required: true, schema: { type: string } }
        - { name: cx,      in: query, required: true, schema: { type: integer } }
        - { name: cy,      in: query, required: true, schema: { type: integer } }
        - { name: r,       in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Map viewport
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorldMapView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/map/sparse:
    get:
      operationId: getWorldMapSparse
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: worldId, in: query, required: true,  schema: { type: string } }
        - { name: cx,      in: query, required: true,  schema: { type: integer } }
        - { name: cy,      in: query, required: true,  schema: { type: integer } }
        - { name: r,       in: query, required: true,  schema: { type: integer } }
        - name: lod
          in: query
          required: false
          schema: { type: string, enum: [thin, mid], default: thin }
          description: "thin = mine marker only (zoom 3); mid = includes ally/allySect (zoom 2)"
      responses:
        '200':
          description: Sparse ownership overlay
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorldMapSparseView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/tile/{tileId}:
    get:
      operationId: getWorldTile
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tileId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Single tile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorldTileView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/me:
    get:
      operationId: getWorldMe
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: worldId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Player world state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PlayerWorldView'
                          - type: object
                            properties:
                              # Server epoch ms at response time (P1-1 clock-offset sample) — see
                              # client/src/net/serverClock.ts. Only this endpoint carries it (the
                              # highest-frequency SLG round-trip), not every PlayerWorldView consumer.
                              serverNow: { type: integer }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/season/transfer/targets:
    get:
      operationId: listTransferTargets
      description: >-
        Mid-season shard transfer (G6/§27): list candidate destination shards for the player's current shard —
        same season, open/active, not full, excluding the current shard. Empty if the current world has no
        seeded WorldDoc.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: worldId, in: query, required: true, schema: { type: string }, description: The player's current shard. }
      responses:
        '200':
          description: Candidate shards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ShardTransferTargetView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/season/transfer:
    post:
      operationId: transferShard
      description: >-
        Mid-season shard transfer (G6/§27): forfeits ALL shard-scoped state in fromWorldId (city/tiles/troops —
        via the same purge used for corrupt-account repair) and re-joins toWorldId fresh, exactly like a
        first-time join. No stat migration. Blocked by: an in-flight march/occupation in fromWorldId
        (TRANSFER_BUSY, recall/wait first), a recent prior transfer (TRANSFER_COOLDOWN,
        SHARD_TRANSFER_COOLDOWN_DAYS=7), or an invalid/full/different-season target (TRANSFER_TARGET_INVALID).
        Family/sect membership is untouched (family is not shard-scoped data).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromWorldId, toWorldId]
              properties:
                fromWorldId: { type: string }
                toWorldId: { type: string }
      responses:
        '200':
          description: Transferred; response is the fresh PlayerWorldView in toWorldId
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerWorldView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '409': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/join:
    post:
      operationId: joinWorld
      description: "Join the world; the system automatically places the player's base (§3.4: priority order: near family → outer-ring starter area → fallback). The player does not submit coordinates; the spawn location is determined by the server."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId]
              properties:
                worldId: { type: string }
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerWorldView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '409': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/enter:
    post:
      operationId: enterWorld
      description: >-
        Aggregated SLG-entry fetch (P1-5, comm-audit-2026-07-27): resolves getMe+joinWorld server-side
        (so the base tile is known before the map window is picked), then composes season/nations/map(or
        mapSparse)/marches/occupations/stationed/worldChannel in parallel — one round-trip replacing the
        9-request waterfall WorldMapNet.loadData() used to fire on every world-map entry. `r` is the
        viewport radius the client already computes from its own canvas size (independent of map center);
        the server centers the returned map window on the resolved mainBaseTile itself. Exactly one of
        `map` / `mapSparse` is populated, matching zoom (1 → map; 2/3 → mapSparse, lod mid/thin).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId, r]
              properties:
                worldId: { type: string }
                r: { type: integer, description: Viewport radius (tiles), from the client's own canvas-size computation. }
                zoom: { type: integer, enum: [1, 2, 3], default: 1 }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [season, nations, me, marches, occupations, stationed, worldChannel]
                        properties:
                          season:
                            allOf: [{ $ref: '#/components/schemas/SeasonView' }]
                            nullable: true
                            description: Null if this worldId has no provisioned world doc yet (should not happen for a real client-resolved shard; kept nullable to match getSeason's own return type).
                          nations:
                            type: array
                            items: { $ref: '#/components/schemas/NationView' }
                          me:
                            allOf:
                              - $ref: '#/components/schemas/PlayerWorldView'
                              - type: object
                                required: [justJoined]
                                properties:
                                  serverNow: { type: integer }
                                  justJoined:
                                    type: boolean
                                    description: True only the first time this account is placed in this world (server-resolved, replaces the client's own wasJoined-diff logic).
                          map: { $ref: '#/components/schemas/WorldMapView' }
                          mapSparse: { $ref: '#/components/schemas/WorldMapSparseView' }
                          marches:
                            type: array
                            items: { $ref: '#/components/schemas/MarchView' }
                          occupations:
                            type: array
                            items: { $ref: '#/components/schemas/OccupationView' }
                          stationed:
                            type: array
                            items: { $ref: '#/components/schemas/StationedView' }
                          worldChannel:
                            type: array
                            description: Same shape as GET /nation/channel (not itself contract-declared — pre-existing gap, P2 backlog).
                            items:
                              type: object
                              required: [id, senderId, senderName, senderPublicId, body, ts]
                              properties:
                                id:             { type: string }
                                senderId:       { type: string }
                                senderName:     { type: string }
                                senderPublicId: { type: string }
                                title:          { type: string }
                                sectName:       { type: string }
                                familyName:     { type: string }
                                body:           { type: string }
                                ts:             { type: integer }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/abandon:
    post:
      operationId: abandonTile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId, x, y]
              properties:
                worldId: { type: string }
                x: { type: integer }
                y: { type: integer }
      responses:
        '200':
          # P1-3 (comm-audit-2026-07-27): the handler already returns the full updated PlayerWorldView
          # (territory.ts abandonTile) — this contract previously under-declared it as bare OkResponse,
          # which is exactly why the client discarded the response and issued a separate GET /world/me.
          description: Abandoned — returns the updated player world state (resources/territory refreshed)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerWorldView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/relocate:
    post:
      operationId: relocateBase
      summary: Manual base relocation (spend RELOCATE_COST coins to move the main base to (x,y), all territories are retained)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId, x, y]
              properties:
                worldId: { type: string }
                x: { type: integer }
                y: { type: integer }
      responses:
        '200':
          description: Relocated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerWorldView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/watchtower:
    post:
      operationId: buildWatchtower
      summary: Build a watchtower (spend WATCHTOWER_COST resources on own territory to create a large-radius persistent vision source; §18 G5 V2)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId, x, y]
              properties:
                worldId: { type: string }
                x: { type: integer }
                y: { type: integer }
      responses:
        '200':
          # P1-3 (comm-audit-2026-07-27): the resource cost is deducted from the player's own state, not
          # visible on the tile itself, so the client legitimately needs both — httpApi.ts attaches `me`
          # alongside the tile so it doesn't have to make a separate GET /world/me round-trip.
          description: Watchtower built — data.me carries the updated player world state (resources spent)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/WorldTileView'
                          - type: object
                            properties:
                              me: { $ref: '#/components/schemas/PlayerWorldView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '402': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '409': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/structure:
    post:
      operationId: buildStructure
      summary: "ADR-051 (P5): build a player structure (arrowTower / blocker) on own or same-family territory"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId, x, y, kind]
              properties:
                worldId: { type: string }
                x: { type: integer }
                y: { type: integer }
                kind: { type: string, enum: [arrowTower, blocker] }
      responses:
        '200':
          # P1-3: same reasoning as /world/watchtower above — attach `me` so the client doesn't need a
          # separate GET /world/me for the resources it just spent.
          description: Structure built — data.me carries the updated player world state (resources spent)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/WorldTileView'
                          - type: object
                            properties:
                              me: { $ref: '#/components/schemas/PlayerWorldView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '402': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '409': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/structure/demolish:
    post:
      operationId: demolishStructure
      summary: "ADR-051 (P5): demolish one's own structure on a tile"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId, x, y]
              properties:
                worldId: { type: string }
                x: { type: integer }
                y: { type: integer }
      responses:
        '200':
          description: Structure demolished
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorldTileView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/march:
    get:
      operationId: getMarches
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: worldId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Active marches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MarchView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }
    post:
      operationId: startMarch
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId, fromX, fromY, toX, toY, kind, troops]
              properties:
                worldId: { type: string }
                fromX: { type: integer }
                fromY: { type: integer }
                toX: { type: integer }
                toY: { type: integer }
                kind: { type: string, enum: [occupy, reinforce, attack, sweep, move] }
                troops: { type: integer }
                teamId:
                  type: string
                  description: "Team (G3-2c): attack-formation template to use for kind=attack/occupy/move; committed troops = sum of troops carried across the team's cards (overrides the troops field). Required for kind=move."
                stationMode:
                  type: string
                  enum: [idle, garrison]
                  description: "ADR-051 (P3a): kind=move dispatch intent — 'garrison' parks the team as a 驻扎 garrison (defends its 3×3 footprint); default/absent → 停留 idle. Ignored for other kinds."
      responses:
        '200':
          # P1-3 (comm-audit-2026-07-27): dispatch deducts troops/resources from the player's own state,
          # not visible on the march itself, so httpApi.ts attaches `me` alongside it — the client can
          # locally append this march to its cached list and adopt `me` directly, instead of following
          # up with GET /world/march + GET /world/me (the exact "3 requests to confirm 1 action" pattern
          # the audit flagged).
          description: March started — data.me carries the updated player world state (troops/resources spent)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/MarchView'
                          - type: object
                            properties:
                              me: { $ref: '#/components/schemas/PlayerWorldView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '409': { $ref: '#/components/responses/ErrorResp' }
        '501': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/march/{marchId}/recall:
    post:
      operationId: recallMarch
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: marchId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId]
              properties:
                worldId: { type: string }
      responses:
        '200':
          description: Recalled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/march/{marchId}/instant-return:
    post:
      operationId: instantReturnMarch
      description: >-
        2026-08-01 (SLG_DESIGN_LOG §46): pay coins to instantly complete an in-transit 'return' march. Cost is
        always computed server-side from the march's remaining travel time — the request body carries no coin
        amount (unlike /world/troops/speedup, this is a single "finish now" action, not a partial buy-down).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: marchId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worldId]
              properties:
                worldId: { type: string }
      responses:
        '200':
          description: Return march completed instantly
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlayerWorldView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/occupations:
    get:
      operationId: getOccupations
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: worldId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: "Own active occupation-holds (2026-07-15 team management status + cancel)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OccupationView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/stationed:
    get:
      operationId: getStationed
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: worldId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: "Own teams stationed on tiles (2026-07-23 field-stationing: status + recall + idle-sprite rendering)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StationedView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /world/territories:
    get:
      operationId: listTerritories
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: worldId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: >-
            Full list of tiles owned by the requester (territory + captured stronghold; excludes the 3×3
            capital footprint). Backs the Territory Overview panel (SLG_DESIGN_LOG.md §26) — `territoryCount`
            on PlayerWorldView is only an aggregate count, this returns the rows for jump/abandon actions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WorldTileView' }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
