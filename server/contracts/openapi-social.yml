          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /social/mail/{mailId}:
    delete:
      operationId: deleteMail
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: mailId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 'Mail deleted (MAIL_HAS_UNCLAIMED_ATTACHMENT error if an attachment has not been claimed yet)'
