                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '409': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /social/mail/send:
    post:
      operationId: sendMail
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toPublicId, subject]
              properties:
                toPublicId: { type: string }
                subject: { type: string }
                body: { type: string }
      responses:
        '200':
          description: 'Mail sent between players (must be mutual friends; no attachments)'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [mailId]
                        properties:
                          mailId: { type: string }
        '400': { $ref: '#/components/responses/ErrorResp' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }
