/achievements:
  get:
    operationId: getAchievements
    tags: [save]
    summary: Achievement definition table + my stats + claimed progress (client computes tier locally, ACHIEVEMENT_DESIGN §6)
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [defs, stats, achievements]
                  properties:
                    defs:
                      type: array
                      items: { $ref: '#/components/schemas/Achievement' }
                    stats:
                      type: object
                      additionalProperties: { type: integer }
                    achievements:
                      $ref: '#/components/schemas/SaveData/properties/achievements'
      '401': { $ref: '#/components/responses/ErrorResp' }

/achievements/claim:
  post:
    operationId: claimAchievement
    tags: [save]
    summary: Claim coins for a specific achievement tier (server re-validates stat≥threshold + $addToSet for idempotent coin grant, §4.3)
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [achId, tier]
            properties:
              achId: { type: string }
              tier: { type: integer, minimum: 1, maximum: 3 }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save, granted]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
                    granted: { type: integer, description: Coins granted this time }
      '400': { $ref: '#/components/responses/ErrorResp' }
      '401': { $ref: '#/components/responses/ErrorResp' }
      '402': { $ref: '#/components/responses/ErrorResp' }
      '409': { $ref: '#/components/responses/ErrorResp' }

/retention:
  get:
    operationId: getRetention
    tags: [save]
    summary: Fetch retention state (check-in monthly calendar + daily task progress + definition table, B5 RETENTION_DESIGN)
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [defs, claimable]
                  properties:
                    checkin:
                      type: object
                      nullable: true
                      properties:
                        monthKey: { type: string }
                        claimedDays: { type: array, items: { type: integer } }
                        lastClaimedDayKey: { type: string }
                    daily:
                      type: object
                      nullable: true
                      properties:
                        dayKey: { type: string }
                        taskPoints: { type: integer }
                        rewardClaimed: { type: boolean }
                        completedTasks:
                          type: object
                          additionalProperties: { type: integer }
                    weekly:
                      type: object
                      nullable: true
                      description: Weekly active chest progress (ECONOMY_NUMBERS §12.3, ISO week key)
                      properties:
                        weekKey: { type: string, description: "ISO-8601 week key, e.g. 2026-W32" }
                        points: { type: integer }
                        claimedTiers: { type: array, items: { type: integer }, description: WEEKLY_CHEST_TIERS thresholds already claimed this week }
                    defs:
                      type: object
                      required: [rewards, tasks, pointsThreshold, dailyCoinsReward, weeklyChestTiers]
                      properties:
                        rewards:
                          type: array
                          items:
                            type: object
                            required: [kind, count]
                            properties:
                              kind:  { type: string, enum: [coins, stamina, material, card, equipment] }
                              count: { type: integer }
                              id:    { type: string, description: Material id (scrap/lead/binding), set only when kind=material }
                              bonusCoins: { type: integer, description: "Small coin top-up delivered alongside the primary reward, milestone slots only (R1b)" }
                        tasks:
                          type: array
                          items:
                            type: object
                            required: [id, points]
                            properties:
                              id:     { type: string }
                              points: { type: integer }
                        pointsThreshold: { type: integer }
                        dailyCoinsReward: { type: integer }
                        weeklyChestTiers:
                          type: array
                          description: WEEKLY_CHEST_TIERS threshold/reward table (ECONOMY_NUMBERS §12.3)
                          items:
                            type: object
                            required: [threshold, reward]
                            properties:
                              threshold: { type: integer }
                              reward:
                                type: object
                                required: [kind, count]
                                properties:
                                  kind:  { type: string, enum: [material, equipment, skin] }
                                  count: { type: integer }
                                  id:    { type: string, description: Material id (scrap/lead/binding), set only when kind=material }
                    claimable:
                      type: object
                      required: [checkin, daily, weeklyTiers]
                      properties:
                        checkin: { type: boolean }
                        daily: { type: boolean }
                        weeklyTiers: { type: array, items: { type: integer }, description: WEEKLY_CHEST_TIERS thresholds reached but not yet claimed }
                    ads:
                      type: object
                      description: Rewarded-ad status for the DailyScene "Ads" tab (RETENTION_DESIGN §6.2/ECONOMY_NUMBERS §6.2)
                      required: [watchedToday, cap, rewardCoins, cooldownMs, nextAvailableAt]
                      properties:
                        watchedToday: { type: integer, description: Ads watched so far today (UTC dayKey) }
                        cap: { type: integer, description: Daily cap (ADS_DAILY_CAP) }
                        rewardCoins: { type: integer, description: Coins granted per ad (ADS_REWARD_COINS) }
                        cooldownMs: { type: integer, description: Minimum interval between two ads (ADS_MIN_INTERVAL_MS) }
                        nextAvailableAt: { type: integer, description: Epoch ms when the next ad becomes available (0 = available now) }
      '401': { $ref: '#/components/responses/ErrorResp' }

/retention/checkin:
  post:
    operationId: claimCheckin
    tags: [save]
    summary: Check in to claim the next slot reward for the current month (idempotent; 409 if already claimed today)
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save, day, reward]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
                    day: { type: integer, description: Slot number claimed this time (1-based) }
                    reward:
                      type: object
                      required: [kind, count]
                      properties:
                        kind: { type: string, enum: [coins, stamina, material, card, equipment] }
                        count: { type: integer }
                        id:    { type: string, description: Material id (material) or the drawn defId (card/equipment) }
                        bonusCoins: { type: integer, description: "Small coin top-up delivered alongside the primary reward, milestone slots only (R1b)" }
      '401': { $ref: '#/components/responses/ErrorResp' }
      '409': { $ref: '#/components/responses/ErrorResp' }

/retention/daily/claim:
  post:
    operationId: claimDailyReward
    tags: [save]
    summary: Claim the daily task full-points coin reward (idempotent; 400 if threshold not reached, 409 if already claimed)
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save, coins]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
                    coins: { type: integer, description: Coins granted this time }
      '400': { $ref: '#/components/responses/ErrorResp' }
      '401': { $ref: '#/components/responses/ErrorResp' }
      '402': { $ref: '#/components/responses/ErrorResp' }
      '409': { $ref: '#/components/responses/ErrorResp' }

/retention/weekly/claim:
  post:
    operationId: claimWeeklyChest
    tags: [save]
    summary: Claim one weekly active chest tier (ECONOMY_NUMBERS §12.3; each of the three tiers is independently claimable once its point threshold is reached within the current ISO week; 400 if not reached, 409 if already claimed)
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [threshold]
            properties:
              threshold: { type: integer, description: "One of WEEKLY_CHEST_TIERS' thresholds (currently 9/15/21)" }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save, threshold, reward]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
                    threshold: { type: integer, description: Tier threshold claimed this time }
                    reward:
                      type: object
                      required: [kind, count]
                      properties:
                        kind: { type: string, enum: [material, equipment, skin] }
                        count: { type: integer }
                        id:    { type: string, description: Material id (material) or the drawn/granted defId (equipment/skin) }
      '400': { $ref: '#/components/responses/ErrorResp' }
      '401': { $ref: '#/components/responses/ErrorResp' }
      '409': { $ref: '#/components/responses/ErrorResp' }

/events:
  get:
    operationId: getEvents
    tags: [events]
    summary: Fetch currently active event list (including this account's participation progress)
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Event list
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [events]
                  properties:
                    events:
                      type: array
                      items:
                        type: object
                        required: [eventId, title, windowStart, windowEnd, myPoints, tasks, rewards]
                        properties:
                          eventId:     { type: string }
                          title:       { type: string }
                          description: { type: string }
                          windowStart: { type: integer }
                          windowEnd:   { type: integer }
                          myPoints:    { type: integer }
                          tasks:
                            type: array
                            items:
                              type: object
                              required: [taskId, kind, target, points, progress, done]
                              properties:
                                taskId:   { type: string }
                                kind:     { type: string }
                                target:   { type: integer }
                                points:   { type: integer }
                                progress: { type: integer }
                                done:     { type: boolean }
                          rewards:
                            type: array
                            items:
                              type: object
                              required: [rewardId, cost, kind, claimedCount]
                              properties:
                                rewardId:     { type: string }
                                cost:         { type: integer }
                                kind:         { type: string }
                                id:           { type: string }
                                count:        { type: integer }
                                maxClaims:    { type: integer }
                                claimedCount: { type: integer }
      '401': { $ref: '#/components/responses/ErrorResp' }

/events/claim:
  post:
    operationId: claimEventReward
    tags: [events]
    summary: Spend event points to redeem a reward
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [eventId, rewardId]
            properties:
              eventId:  { type: string }
              rewardId: { type: string }
    responses:
      '200':
        description: Redemption successful
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [pointsLeft, reward]
                  properties:
                    pointsLeft: { type: integer }
                    reward:
                      type: object
                      required: [kind]
                      properties:
                        kind:  { type: string }
                        id:    { type: string }
                        count: { type: integer }
      '400': { $ref: '#/components/responses/ErrorResp' }
      '401': { $ref: '#/components/responses/ErrorResp' }
      '402': { $ref: '#/components/responses/ErrorResp' }
      '403': { $ref: '#/components/responses/ErrorResp' }
      '404': { $ref: '#/components/responses/ErrorResp' }
      '409': { $ref: '#/components/responses/ErrorResp' }

# —— S10 titles (L2-2, TITLE_DESIGN): fetch granted titles + select the displayed title ——
/titles:
  get:
    operationId: getTitles
    tags: [save]
    summary: All titles granted to the current account (including derived source/seasonNo) + currently equipped title
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [titles, equipped]
                  properties:
                    titles:
                      type: array
                      items:
                        type: object
                        required: [id, source]
                        properties:
                          id: { type: string, description: 'Title id (ladder.s{N}.{rank} / slg.s{N}.{key} / ach.{key} / event.{key})' }
                          source: { type: string, enum: [ladder, slg, achievement, event] }
                          seasonNo: { type: integer, description: Season number (only for ladder/slg type titles) }
                    equipped:
                      type: string
                      nullable: true
                      description: Currently equipped title id; null if none equipped
      '401': { $ref: '#/components/responses/ErrorResp' }

/title/equip:
  put:
    operationId: equipTitle
    tags: [save]
    summary: Select the currently displayed title (only titles already granted; empty string = unequip), writes equipped.title and pushes save
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [titleId]
            properties:
              titleId: { type: string, description: Title id to equip; empty string means unequip the displayed title }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
      '401': { $ref: '#/components/responses/ErrorResp' }
      '403': { $ref: '#/components/responses/ErrorResp' }

/avatar/equip:
  put:
    operationId: equipAvatar
    tags: [save]
    summary: "Select the displayed avatar (writes equipped.avatar and pushes save). Composite id \"<category>:<key>\" (preset/title/hero/equip/material/skin); preset always allowed, other categories require the item to appear in the player's lifetime-owned records (titles / everOwned / inventory.skins)."
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [avatarId]
            properties:
              avatarId: { type: string, description: "Composite avatar id to equip, e.g. preset:3, title:t_champion, hero:archer, equip:sword_01, material:scrap, skin:skin_04" }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
      '401': { $ref: '#/components/responses/ErrorResp' }
      '403': { $ref: '#/components/responses/ErrorResp' }

/skin/equip:
  put:
    operationId: equipSkin
    tags: [save]
    summary: Equip/unequip a character skin (writes equipped["skin:<unitType>"] and pushes save). One slot per character (LOBBY_IA_REDESIGN §15); skinId null unequips. Requires lifetime ownership (inventory.skins / everOwned.skin).
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [unitType]
            properties:
              unitType: { type: string, description: "Character UnitType this skin slot targets, e.g. archer" }
              skinId: { type: string, nullable: true, description: "Skin id to equip; null unequips the slot" }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
      '401': { $ref: '#/components/responses/ErrorResp' }
      '403': { $ref: '#/components/responses/ErrorResp' }

/flags:
  put:
    operationId: setFlag
    tags: [save]
    summary: Set one client-preference flag by key (writes flags.<key> and pushes save) — onboarding/consent/tutorial-seen style booleans with no ownership semantics.
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [key, value]
            properties:
              key: { type: string, description: "Flag key, e.g. tutorial_done, gdprConsent, featSeen.<featureId>" }
              value: { type: boolean }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
      '400': { $ref: '#/components/responses/ErrorResp' }
      '401': { $ref: '#/components/responses/ErrorResp' }

/lobby/badges:
  get:
    operationId: getLobbyBadges
    tags: [save]
    summary: >-
      Aggregated lobby red-dot fetch (P1-4, comm-audit-2026-07-27): merges GET /social/badges +
      GET /achievements + GET /retention (claimable only) + GET /events (availability only) into
      one call, replacing the 4-request waterfall the client used to fire on every lobby entry.
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [social, achievements, retentionClaimable, eventsAvailable]
                  properties:
                    social: { $ref: '#/components/schemas/SocialBadges' }
                    achievements:
                      type: object
                      required: [defs, stats, achievements]
                      properties:
                        defs:
                          type: array
                          items: { $ref: '#/components/schemas/Achievement' }
                        stats:
                          type: object
                          additionalProperties: { type: integer }
                        achievements:
                          $ref: '#/components/schemas/SaveData/properties/achievements'
                    retentionClaimable:
                      type: object
                      required: [checkin, daily]
                      properties:
                        checkin: { type: boolean }
                        daily: { type: boolean }
                    eventsAvailable: { type: boolean }
      '401': { $ref: '#/components/responses/ErrorResp' }

