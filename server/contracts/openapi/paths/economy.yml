/shop/items:
  get:
    operationId: getShopItems
    tags: [shop]
    summary: Shop item list
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/ShopItem' }

/shop/buy:
  post:
    operationId: shopBuy
    tags: [shop]
    summary: Direct purchase (deduct coins → deliver item → push save). Optional qty (default 1) buys
      several units in one charge+delivery instead of the caller looping — all-or-nothing (insufficient
      funds or a daily cap that can't fit the whole qty rejects the entire request, nothing is charged).
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [itemId]
            properties:
              itemId: { type: string }
              qty: { type: integer, minimum: 1, maximum: 20, default: 1 }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save, granted]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
                    granted: { type: string }
      '402': { $ref: '#/components/responses/ErrorResp' }

/gacha/pools:
  get:
    operationId: getGachaPools
    tags: [gacha]
    summary: Gacha pool list
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [pools]
                  properties:
                    pools:
                      type: array
                      items: { $ref: '#/components/schemas/GachaPool' }

/gacha/draw:
  post:
    operationId: gachaDraw
    tags: [gacha]
    summary: Gacha draw (single/ten-pull, atomic, each draw persisted individually)
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [poolId, count]
            properties:
              poolId: { type: string }
              count: { type: integer, enum: [1, 10] }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save, results, overflow, cardGrants, equipmentGrants]
                  properties:
                    save:
                      allOf:
                        - $ref: '#/components/schemas/SaveData'
                      description: >-
                        Lean (2026-07-28): `cardInv`/`equipmentInv` are always `null` on this response —
                        the highest-frequency card/equipment-granting endpoint skips the full-inventory
                        join on every call. Adopt via SaveManager.adoptServerPartial with `cardGrants`/
                        `equipmentGrants` below as the upsert patch, never the plain adoptServer/reconcile.
                    results:
                      type: array
                      items: { $ref: '#/components/schemas/GachaResult' }
                    overflow:
                      type: object
                      required: [cardMailed, cardCompensatedCoins, equipMailed, equipCompensatedCoins]
                      description: >-
                        Roster/inventory-full overflow summary for this draw (CHARACTER_CARDS_DESIGN §4 /
                        EQUIPMENT_DESIGN §3.3): the first 10 overflow items per type since that inventory last
                        had free space are mailed as real instances; the rest are coin-compensated. All-zero
                        when nothing overflowed.
                      properties:
                        cardMailed: { type: integer, minimum: 0 }
                        cardCompensatedCoins: { type: integer, minimum: 0 }
                        equipMailed: { type: integer, minimum: 0 }
                        equipCompensatedCoins: { type: integer, minimum: 0 }
                    cardGrants:
                      type: array
                      items: { $ref: '#/components/schemas/CardInstance' }
                      description: Card instances this draw actually added to cardInv (never the mailed-overflow ones).
                    equipmentGrants:
                      type: array
                      items: { $ref: '#/components/schemas/EquipmentInstance' }
                      description: Equipment instances this draw actually added to equipmentInv (never the mailed-overflow ones).
      '402': { $ref: '#/components/responses/ErrorResp' }
      '404': { $ref: '#/components/responses/ErrorResp' }

/fate/redeem:
  post:
    operationId: redeemFate
    tags: [gacha]
    summary: Redeem Fate Points for a chosen past-featured legendary (GACHA_DESIGN §7)
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [itemId]
            properties:
              itemId: { type: string, description: 'a (past-)featured limited legendary itemId' }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save, granted]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
                    granted: { type: string }
      '400': { $ref: '#/components/responses/ErrorResp' }
      '402': { $ref: '#/components/responses/ErrorResp' }

/monthly-card/buy:
