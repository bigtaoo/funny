    operationId: monthlyCardBuy
    tags: [gacha]
    summary: Buy the monthly card (GACHA_DESIGN §5; requires a verified store receipt — 400 INVALID_RECEIPT on mismatch; single-slot — 400 ALREADY_ACTIVE while a card is still running). Web (Paddle) never calls this route — the Paddle webhook grants it server-side after its own signature check.
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [platform, receipt]
            properties:
              platform: { type: string }
              receipt: { type: string }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
      '400': { $ref: '#/components/responses/ErrorResp' }

/year-card/buy:
  post:
    operationId: yearCardBuy
    tags: [gacha]
    summary: Buy the year card (GACHA_DESIGN §5; 365-day subscription; requires a verified store receipt — 400 INVALID_RECEIPT on mismatch; single-slot — 400 ALREADY_ACTIVE while a card is still running). Web (Paddle) never calls this route — the Paddle webhook grants it server-side after its own signature check.
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [platform, receipt]
            properties:
              platform: { type: string }
              receipt: { type: string }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
      '400': { $ref: '#/components/responses/ErrorResp' }

/monthly-card/claim:
  post:
    operationId: monthlyCardClaim
    tags: [gacha]
    summary: Claim the monthly card daily coins (once per UTC day, GACHA_DESIGN §5)
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save, claimed]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
                    claimed: { type: integer, description: 'coins claimed this call (0 = no active card or already claimed today)' }
      '400': { $ref: '#/components/responses/ErrorResp' }

/recharge/claim:
  post:
    operationId: claimRechargeMilestone
    tags: [gacha]
    summary: Claim a cumulative-recharge milestone reward (GACHA_DESIGN §13). Progress (totalRechargeCents) is read from save.monetization; this only records the claim + delivers the reward.
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tierId]
            properties:
              tierId: { type: integer, minimum: 1 }
    responses:
      '200':
        description: Claim successful
        content:
          application/json:
            schema:
              type: object
              required: [ok, data]
              properties:
                ok: { type: boolean, enum: [true] }
                data:
                  type: object
                  required: [save, rewards]
                  properties:
                    save: { $ref: '#/components/schemas/SaveData' }
                    rewards:
                      type: array
                      items: { $ref: '#/components/schemas/RechargeReward' }
      '400': { $ref: '#/components/responses/ErrorResp' }
      '409': { $ref: '#/components/responses/ErrorResp' }

/starter/buy:
  post:
    operationId: starterBuy
    tags: [gacha]
